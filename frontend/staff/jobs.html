<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>งานของฉัน — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    /* mobile-first: คอลัมน์เดียวเสมอ ปุ่ม/พื้นที่แตะใหญ่พอสำหรับใช้งานหน้างาน */
    .container-staff { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 24px 0 10px;
    }
    .section-title:first-of-type { margin-top: 8px; }

    .job-card { margin-bottom: 12px; }
    .job-time { font-size: 20px; font-weight: 700; }
    .job-day { font-size: 12px; color: var(--muted); margin-bottom: 10px; }

    .job-row { display: flex; gap: 8px; font-size: 14px; padding: 6px 0; border-bottom: 1px solid var(--border-light); }
    .job-row:last-of-type { border-bottom: none; }
    .job-row .icon { flex-shrink: 0; width: 20px; text-align: center; }
    .job-row .text { flex: 1; }

    .job-actions { display: flex; gap: 8px; margin-top: 14px; }
    .job-actions .btn { flex: 1; padding: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container-staff">
    <h1>งานของฉัน</h1>
    <p class="subtitle">รายการนัดหมายที่ต้องไปรับของเก่าและส่งของใหม่</p>

    <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูล...</div>
    <div class="msg msg-error" id="error-msg"></div>
    <div class="empty-state" id="empty-msg" style="display: none;">ยังไม่มีงานที่ได้รับมอบหมาย</div>

    <div id="job-sections"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole(["staff", "admin"])
      renderNav({ root: "../", dir: "staff", active: "jobs" })
      load()
    })()

    const FURNITURE_LABEL = {
      sofa: "โซฟา", table: "โต๊ะ", chair: "เก้าอี้", bed: "เตียง",
      wardrobe: "ตู้เสื้อผ้า", shelf: "ชั้นวางของ", other: "อื่นๆ",
    }

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const emptyMsg = document.getElementById("empty-msg")
    const sectionsWrap = document.getElementById("job-sections")

    function formatTime(dt) {
      return new Date(dt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })
    }
    function formatDay(dt) {
      return new Date(dt).toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "short" })
    }
    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate()
    }

    function renderJobCard(job) {
      const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(job.address)}`
      const card = document.createElement("div")
      card.className = "card job-card"
      card.innerHTML = `
        <div class="job-time">${formatTime(job.timeslot.datetime)}</div>
        <div class="job-day">${formatDay(job.timeslot.datetime)}</div>
        <div class="job-row"><span class="icon">👤</span><span class="text">${job.user.full_name} · ${job.user.phone || "ไม่มีเบอร์โทร"}</span></div>
        <div class="job-row"><span class="icon">📍</span><span class="text">${job.address}</span></div>
        <div class="job-row"><span class="icon">📦</span><span class="text">รับ: ${FURNITURE_LABEL[job.item.furniture_type] || job.item.furniture_type} (${job.item.condition})</span></div>
        <div class="job-row"><span class="icon">🚚</span><span class="text">ส่ง: ${job.product ? job.product.name : "ไม่มี (คืนส่วนลดอย่างเดียว)"}</span></div>
        <div class="job-actions">
          <a class="btn btn-outline" href="${mapsUrl}" target="_blank" rel="noopener" style="text-align:center; text-decoration:none;">เปิดแผนที่</a>
          <button class="btn btn-primary open-checklist-btn">เปิด Checklist</button>
        </div>
      `
      card.querySelector(".open-checklist-btn").addEventListener("click", () => {
        location.href = `checklist.html?id=${job.id}`
      })
      return card
    }

    async function load() {
      let jobs
      try {
        jobs = await getStaffJobs()
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "block"
        return
      }

      loadingMsg.style.display = "none"

      if (jobs.length === 0) {
        emptyMsg.style.display = "block"
        return
      }

      jobs.sort((a, b) => new Date(a.timeslot.datetime) - new Date(b.timeslot.datetime))

      const now = new Date()
      const done = jobs.filter((j) => j.status === "completed")
      const today = jobs.filter((j) => j.status !== "completed" && isSameDay(new Date(j.timeslot.datetime), now))
      const upcoming = jobs.filter((j) => j.status !== "completed" && !isSameDay(new Date(j.timeslot.datetime), now))

      sectionsWrap.innerHTML = ""
      const sections = [
        ["วันนี้", today],
        ["กำลังจะถึง", upcoming],
        ["เสร็จแล้ว", done],
      ]
      for (const [label, list] of sections) {
        if (list.length === 0) continue
        const title = document.createElement("div")
        title.className = "section-title"
        title.textContent = `${label} (${list.length})`
        sectionsWrap.appendChild(title)
        list.forEach((job) => sectionsWrap.appendChild(renderJobCard(job)))
      }
    }
  </script>
</body>
</html>

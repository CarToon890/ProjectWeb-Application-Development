<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เข้าสู่ระบบ — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .register-link {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 18px;
    }
    .register-link a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body class="center-page">
  <div class="auth-card auth-card--sm">
    <div class="logo-standalone">THE DISPOSAL GUILT</div>
    <h1>เข้าสู่ระบบ</h1>
    <p class="subtitle">เข้าสู่ระบบเพื่อประเมินของเก่าของคุณ</p>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" name="username" id="username" required autocomplete="username" autofocus />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" name="password" id="password" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">เข้าสู่ระบบ</button>

      <div class="msg msg-error" id="error-msg"></div>
    </form>

    <div class="register-link">
      ยังไม่มีบัญชี? <a href="register.html">สมัครสมาชิก</a>
    </div>
  </div>

  <!-- โหลด api.js ก่อน แล้วค่อย auth.js (มีฟังก์ชัน saveToken) -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const form = document.getElementById('login-form')
    const submitBtn = document.getElementById('submit-btn')
    const errorMsg = document.getElementById('error-msg')

    // รองรับ ?next= เพื่อพากลับหน้าเดิมหลังล็อกอินสำเร็จ (เช่นถูกเด้งมาจาก requireLogin)
    const nextPage = new URLSearchParams(location.search).get('next')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorMsg.style.display = 'none'
      submitBtn.disabled = true
      submitBtn.textContent = 'กำลังเข้าสู่ระบบ...'

      try {
        const { access_token } = await login(form.username.value.trim(), form.password.value)
        saveToken(access_token)

        // cache role ไว้ใช้กับ requireRole() โดยไม่ต้องยิง getMe() ซ้ำทุกหน้า
        try {
          const me = await getMe()
          cacheRole(me.role)
        } catch (e) {
          // cache ไม่ได้ก็ไม่เป็นไร requireRole() จะไปเรียกเองตอนจำเป็น
        }

        location.href = nextPage || 'assessment-form.html'
      } catch (err) {
        errorMsg.textContent = `เข้าสู่ระบบไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = 'block'
        submitBtn.disabled = false
        submitBtn.textContent = 'เข้าสู่ระบบ'
      }
    })
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>การจองของฉัน — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .booking-card { cursor: pointer; }
    .booking-card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
    .booking-title { font-size: 15px; font-weight: 600; }
    .booking-sub { font-size: 12px; color: var(--muted-2); }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 4px 0;
    }
    .summary-row .label { color: var(--muted); }
    .summary-row .value { font-weight: 500; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container container-lg">
    <h1>การจองของฉัน</h1>
    <p class="subtitle">รายการนัดหมายทั้งหมดของคุณ เรียงจากล่าสุด</p>

    <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูล...</div>
    <div class="msg msg-error" id="error-msg"></div>
    <div class="empty-state" id="empty-msg" style="display: none;">
      ยังไม่มีการจอง — <a href="assessment-form.html" style="color: var(--accent);">เริ่มประเมินของเก่าเลย</a>
    </div>

    <div class="grid" id="booking-grid"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "bookings" })

    const STATUS_LABEL = {
      pending: "รอยืนยัน", confirmed: "ยืนยันแล้ว", in_transit: "กำลังขนส่ง",
      completed: "เสร็จสิ้น", cancelled: "ยกเลิกแล้ว",
    }
    const STATUS_BADGE_CLASS = {
      pending: "badge-muted", confirmed: "badge-accent", in_transit: "badge-accent",
      completed: "badge-ok", cancelled: "badge-danger",
    }

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const emptyMsg = document.getElementById("empty-msg")
    const grid = document.getElementById("booking-grid")

    function formatDate(dt) {
      const d = new Date(dt)
      return d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "numeric" })
    }

    async function load() {
      let bookings
      try {
        bookings = await getBookings()
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "block"
        return
      }

      loadingMsg.style.display = "none"
      bookings.sort((a, b) => b.id - a.id)

      if (bookings.length === 0) {
        emptyMsg.style.display = "block"
        return
      }

      grid.innerHTML = ""
      for (const booking of bookings) {
        const card = document.createElement("div")
        card.className = "card booking-card"
        card.innerHTML = `
          <div class="booking-card-head">
            <div>
              <div class="booking-title">การจอง #${booking.id}</div>
              <div class="booking-sub">${formatDate(booking.created_at)}</div>
            </div>
            <span class="badge ${STATUS_BADGE_CLASS[booking.status] || "badge-muted"}">${STATUS_LABEL[booking.status] || booking.status}</span>
          </div>
          <div class="summary-row"><span class="label">ที่อยู่</span><span class="value">${booking.address}</span></div>
          <div class="summary-row"><span class="label">ยอดรวม</span><span class="value">${booking.total_price.toLocaleString()} บาท</span></div>
        `
        card.addEventListener("click", () => {
          location.href = `booking-detail.html?id=${booking.id}`
        })
        grid.appendChild(card)
      }
    }

    load()
  </script>
</body>
</html>

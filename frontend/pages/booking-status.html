<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สถานะการจอง — The Disposal Guilt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 14px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    nav .logo { font-size: 13px; color: #6b6b6b; letter-spacing: 0.04em; }
    nav .links { display: flex; gap: 18px; align-items: center; font-size: 13px; }
    nav .links a { color: #3a3a3a; text-decoration: none; }
    nav .links a:hover { color: #3b7dd8; }
    nav button {
      background: none; border: none; font-size: 13px; color: #b91c1c; cursor: pointer; font-family: inherit;
    }

    .container { max-width: 600px; margin: 0 auto; padding: 32px 24px; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b6b6b; margin-bottom: 20px; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      margin-bottom: 18px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .label { color: #6b6b6b; }
    .summary-row .value { font-weight: 500; }

    .timeline {
      display: flex;
      justify-content: space-between;
      margin: 24px 0 8px;
    }
    .timeline-step {
      flex: 1;
      text-align: center;
      position: relative;
      font-size: 11px;
      color: #9a9a9a;
    }
    .timeline-step .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ddd;
      margin: 0 auto 6px;
    }
    .timeline-step.done .dot { background: #16a34a; }
    .timeline-step.current .dot { background: #3b7dd8; }
    .timeline-step.done, .timeline-step.current { color: #1a1a1a; font-weight: 500; }
    .timeline-step::before {
      content: '';
      position: absolute;
      top: 6px;
      left: -50%;
      width: 100%;
      height: 2px;
      background: #ddd;
      z-index: -1;
    }
    .timeline-step:first-child::before { display: none; }
    .timeline-step.done::before { background: #16a34a; }

    .cancelled-badge {
      display: inline-block;
      background: #fff0f0;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
    }

    button.action {
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button.action:hover { opacity: 0.85; }
    button.action:disabled { opacity: 0.4; cursor: not-allowed; }
    .cancel-btn { background: #fff0f0; color: #b91c1c; }
    .admin-select {
      padding: 9px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      font-family: inherit;
    }

    .admin-panel {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 8px;
    }

    #error-msg, #info-msg {
      display: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 12px;
    }
    #error-msg { background: #fff0f0; border: 1px solid #fca5a5; color: #b91c1c; }
    #info-msg { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">THE DISPOSAL GUILT</div>
    <div class="links">
      <a href="../index.html">หน้าแรก</a>
      <a href="eco-dashboard.html">Eco Dashboard</a>
      <a href="profile.html">โปรไฟล์</a>
      <button onclick="handleLogout()">ออกจากระบบ</button>
    </div>
  </nav>

  <div class="container">
    <h1>สถานะการจอง</h1>
    <p class="subtitle" id="booking-id-label">กำลังโหลด...</p>

    <div class="card" id="booking-card">
      <div id="timeline-wrap"></div>
      <div id="summary"></div>
    </div>

    <div class="card" id="action-card" style="display:none;">
      <button class="action cancel-btn" id="cancel-btn">ยกเลิกการจอง</button>
      <div class="admin-panel" id="admin-panel" style="display:none;">
        <select class="admin-select" id="admin-status">
          <option value="pending">pending</option>
          <option value="confirmed">confirmed</option>
          <option value="in_transit">in_transit</option>
          <option value="completed">completed</option>
          <option value="cancelled">cancelled</option>
        </select>
        <button class="action" id="admin-update-btn" style="background:#1a1a1a; color:#fff;">อัปเดตสถานะ (admin)</button>
      </div>
      <div id="error-msg"></div>
      <div id="info-msg"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireLogin()

    const params = new URLSearchParams(location.search)
    const bookingId = params.get('id')

    const STEPS = ['pending', 'confirmed', 'in_transit', 'completed']
    const STEP_LABELS = { pending: 'รอดำเนินการ', confirmed: 'ยืนยันแล้ว', in_transit: 'กำลังขนส่ง', completed: 'เสร็จสิ้น' }

    const timelineWrap = document.getElementById('timeline-wrap')
    const summaryEl = document.getElementById('summary')
    const bookingIdLabel = document.getElementById('booking-id-label')
    const actionCard = document.getElementById('action-card')
    const cancelBtn = document.getElementById('cancel-btn')
    const adminPanel = document.getElementById('admin-panel')
    const adminStatusSelect = document.getElementById('admin-status')
    const adminUpdateBtn = document.getElementById('admin-update-btn')
    const errorMsg = document.getElementById('error-msg')
    const infoMsg = document.getElementById('info-msg')

    function renderTimeline(status) {
      if (status === 'cancelled') {
        timelineWrap.innerHTML = `<span class="cancelled-badge">การจองนี้ถูกยกเลิกแล้ว</span>`
        return
      }
      const currentIdx = STEPS.indexOf(status)
      timelineWrap.innerHTML = `
        <div class="timeline">
          ${STEPS.map((step, idx) => `
            <div class="timeline-step ${idx < currentIdx ? 'done' : ''} ${idx === currentIdx ? 'current' : ''}">
              <div class="dot"></div>
              ${STEP_LABELS[step]}
            </div>
          `).join('')}
        </div>
      `
    }

    function renderSummary(booking) {
      summaryEl.innerHTML = `
        <div class="summary-row"><span class="label">รหัสการจอง</span><span class="value">#${booking.id}</span></div>
        <div class="summary-row"><span class="label">ที่อยู่</span><span class="value">${booking.address}</span></div>
        <div class="summary-row"><span class="label">ยอดที่ต้องจ่าย</span><span class="value">${booking.total_price.toLocaleString()} บาท</span></div>
        <div class="summary-row"><span class="label">สถานะ</span><span class="value">${booking.status}</span></div>
      `
    }

    async function load() {
      if (!bookingId) {
        bookingIdLabel.textContent = 'ไม่พบรหัสการจอง'
        return
      }

      let booking
      try {
        booking = await getBooking(bookingId)
      } catch (err) {
        bookingIdLabel.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        return
      }

      bookingIdLabel.textContent = `การจอง #${booking.id}`
      renderTimeline(booking.status)
      renderSummary(booking)

      const activeStatus = !['completed', 'cancelled'].includes(booking.status)
      actionCard.style.display = 'block'
      cancelBtn.style.display = activeStatus ? 'inline-block' : 'none'
      cancelBtn.disabled = !activeStatus

      cancelBtn.onclick = async () => {
        cancelBtn.disabled = true
        errorMsg.style.display = 'none'
        try {
          await cancelBooking(booking.id)
          infoMsg.textContent = 'ยกเลิกการจองสำเร็จ'
          infoMsg.style.display = 'block'
          await load()
        } catch (err) {
          errorMsg.textContent = `ยกเลิกไม่สำเร็จ: ${err.message}`
          errorMsg.style.display = 'block'
          cancelBtn.disabled = false
        }
      }

      try {
        const me = await getMe()
        if (me.role === 'admin') {
          adminPanel.style.display = 'flex'
          adminStatusSelect.value = booking.status
          adminUpdateBtn.onclick = async () => {
            errorMsg.style.display = 'none'
            try {
              await updateBookingStatus(booking.id, adminStatusSelect.value)
              infoMsg.textContent = 'อัปเดตสถานะสำเร็จ'
              infoMsg.style.display = 'block'
              await load()
            } catch (err) {
              errorMsg.textContent = `อัปเดตไม่สำเร็จ: ${err.message}`
              errorMsg.style.display = 'block'
            }
          }
        }
      } catch (e) {
        // เช็ค role ไม่ได้ก็ไม่แสดง admin panel เฉยๆ
      }
    }

    load()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จองสำเร็จเรียบร้อย — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .success-summary-box {
      background: var(--surface-2);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-5);
      border: 1px solid var(--border);
      margin-bottom: var(--sp-6);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: var(--sp-2) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .label { color: var(--muted); }
    .summary-row .value { font-weight: 600; color: var(--ink); }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-sm">
      <div class="auth-card" style="margin: 0 auto; text-align: center;">
        <div id="loading-msg" class="empty-state">กำลังดึงข้อมูลการจอง...</div>
        <div class="msg msg-error" id="error-msg"></div>

        <div id="content" style="display: none;">
          <div style="display: flex; justify-content: center; margin-bottom: var(--sp-4);">
            <div class="icon-wrap icon-ok icon-lg" style="width: 72px; height: 72px; border-radius: 50%;">
              <i data-lucide="check-circle" style="width: 36px; height: 36px;"></i>
            </div>
          </div>

          <h1 style="font-size: 24px; margin-bottom: 4px;">ยืนยันการจองสำเร็จ!</h1>
          <p class="subtitle" id="booking-id-label">-</p>

          <div class="success-summary-box" style="text-align: left;">
            <div id="summary"></div>
          </div>

          <div style="display: flex; flex-direction: column; gap: var(--sp-3);">
            <button class="btn btn-primary btn-block btn-lg" id="status-btn">
              <i data-lucide="calendar-check"></i> ดูสถานะและติดตามงาน
            </button>
            <a href="../index.html" class="btn btn-outline btn-block">
              <i data-lucide="home"></i> กลับหน้าแรก
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "bookings" })
    renderFooter({ root: "../", dir: "pages" })

    const params = new URLSearchParams(location.search)
    const bookingId = params.get('id')

    const loadingMsg = document.getElementById('loading-msg')
    const errorMsg = document.getElementById('error-msg')
    const content = document.getElementById('content')
    const bookingIdLabel = document.getElementById('booking-id-label')
    const summary = document.getElementById('summary')

    if (!bookingId) {
      loadingMsg.style.display = 'none'
      errorMsg.textContent = 'ไม่พบรหัสการจอง'
      errorMsg.style.display = 'flex'
    } else {
      getBookingDetail(bookingId).then(data => {
        loadingMsg.style.display = 'none'
        bookingIdLabel.textContent = `รหัสคำสั่งจอง #${data.id}`

        const d = new Date(data.timeslot.datetime)
        const dateStr = d.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
        const timeStr = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'

        summary.innerHTML = `
          <div class="summary-row"><span class="label">วันเวลานัดหมาย</span><span class="value">${dateStr} (${timeStr})</span></div>
          <div class="summary-row"><span class="label">ทีมช่างผู้ดูแล</span><span class="value text-accent">${data.timeslot.technician_name}</span></div>
          <div class="summary-row"><span class="label">ยอดชำระสุทธิ</span><span class="value text-ok">฿${data.total_price.toLocaleString()} บาท</span></div>
          <div class="summary-row"><span class="label">สถานที่</span><span class="value" style="max-width:60%; text-align:right;">${data.address}</span></div>
        `

        document.getElementById('status-btn').addEventListener('click', () => {
          location.href = `booking-detail.html?id=${data.id}`
        })

        content.style.display = 'block'
        if (typeof lucide !== 'undefined') lucide.createIcons({ nameAttr: 'data-lucide' })
      }).catch(err => {
        loadingMsg.style.display = 'none'
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = 'flex'
      })
    }

    initPage()
  </script>
</body>
</html>

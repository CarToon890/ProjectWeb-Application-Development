<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ขั้นตอนที่ 3: เลือกวัน-เวลานัดหมาย — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .day-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--sp-4);
    }
    .day-header {
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: var(--sp-3);
      padding-bottom: var(--sp-2);
      border-bottom: 1px solid var(--border-light);
    }
    .day-header svg { width: 18px; height: 18px; color: var(--accent); }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: var(--sp-3);
    }

    .slot-btn {
      padding: var(--sp-3) var(--sp-2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface-2);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      color: var(--ink);
    }
    .slot-btn .time { font-size: 15px; font-weight: 700; color: var(--ink); }
    .slot-btn .tech { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
    .slot-btn:hover { border-color: var(--accent); background: var(--accent-bg); }
    .slot-btn.selected {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent-ink);
      box-shadow: 0 0 0 2px var(--accent-border);
    }
    .slot-btn.selected .time { color: var(--accent-ink); }
    .slot-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }

    .notice-card {
      background: linear-gradient(135deg, var(--accent-bg) 0%, rgba(5, 150, 105, 0.08) 100%);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-5);
      margin-bottom: var(--sp-6);
      display: flex;
      align-items: center;
      gap: var(--sp-3);
    }
    .notice-card svg { width: 24px; height: 24px; color: var(--accent); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-md">
      <!-- Stepper Wizard -->
      <div id="app-stepper"></div>

      <div class="notice-card">
        <i data-lucide="truck"></i>
        <div>
          <strong style="display: block; font-size: 14px; color: var(--accent-ink);">รับจบในรอบเดียว: ส่งของใหม่ + ขนของเก่าออกให้</strong>
          <span style="font-size: 12px; color: var(--muted);">ทีมช่างจะนำสินค้าใหม่ไปส่ง พร้อมตรวจรับและขนย้ายของเก่ากลับในรอบเวลาเดียวกัน</span>
        </div>
      </div>

      <div class="page-header" style="margin-bottom: var(--sp-5);">
        <div class="page-header-main">
          <h1>เลือกรอบวัน-เวลานัดหมาย</h1>
          <p class="subtitle" style="margin-bottom: 0;">เลือกรอบเวลาที่สะดวกเพื่อให้ทีมช่างเข้าให้บริการ</p>
        </div>
      </div>

      <div id="loading-msg" class="empty-state">กำลังค้นหารอบเวลาที่ว่าง...</div>
      <div id="slots-wrap"></div>
      <div class="empty-state" id="empty-msg" style="display: none;">
        <i data-lucide="calendar-x"></i>
        <div>ไม่มีช่วงเวลาว่างในขณะนี้ กรุณากลับมาตรวจสอบใหม่อีกครั้ง</div>
      </div>

      <div class="msg msg-error" id="error-msg"></div>

      <div style="margin-top: var(--sp-6);">
        <button class="btn btn-primary btn-block btn-lg" id="next-btn" disabled>
          <i data-lucide="arrow-right"></i> ถัดไป: ตรวจสอบและยืนยันการจอง (ขั้นตอนที่ 4)
        </button>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "assess" })
    renderStepper(3)
    renderFooter({ root: "../", dir: "pages" })

    const params = new URLSearchParams(location.search)
    const itemId = params.get('item_id') || getFlow().item_id
    const productId = params.get('product_id') || getFlow().product_id

    const loadingMsg = document.getElementById('loading-msg')
    const emptyMsg = document.getElementById('empty-msg')
    const errorMsg = document.getElementById('error-msg')
    const slotsWrap = document.getElementById('slots-wrap')
    const nextBtn = document.getElementById('next-btn')

    let selectedTimeslotId = null

    function formatDayHeader(dateStr) {
      const d = new Date(dateStr)
      return d.toLocaleDateString('th-TH', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      })
    }

    function formatTime(dateStr) {
      const d = new Date(dateStr)
      return d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }) + ' น.'
    }

    function groupByDay(slots) {
      const groups = {}
      for (const slot of slots) {
        const key = slot.datetime.slice(0, 10)
        if (!groups[key]) groups[key] = []
        groups[key].push(slot)
      }
      return groups
    }

    async function loadTimeslots() {
      try {
        const slots = await getTimeslots()
        loadingMsg.style.display = 'none'

        if (slots.length === 0) {
          emptyMsg.style.display = 'block'
          return
        }

        const groups = groupByDay(slots)
        slotsWrap.innerHTML = ''

        for (const [dayKey, daySlots] of Object.entries(groups)) {
          const card = document.createElement('div')
          card.className = 'day-card'

          const header = document.createElement('div')
          header.className = 'day-header'
          header.innerHTML = `<i data-lucide="calendar"></i> <span>${formatDayHeader(daySlots[0].datetime)}</span>`
          card.appendChild(header)

          const grid = document.createElement('div')
          grid.className = 'slot-grid'

          for (const slot of daySlots) {
            const btn = document.createElement('button')
            btn.className = 'slot-btn'
            btn.innerHTML = `
              <span class="time">${formatTime(slot.datetime)}</span>
              <span class="tech"><i data-lucide="user" style="width:12px;height:12px;"></i> ${slot.technician_name}</span>
            `
            btn.addEventListener('click', () => {
              document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'))
              btn.classList.add('selected')
              selectedTimeslotId = slot.id
              nextBtn.disabled = false
            })
            grid.appendChild(btn)
          }

          card.appendChild(grid)
          slotsWrap.appendChild(card)
        }

        if (typeof lucide !== 'undefined') lucide.createIcons({ nameAttr: 'data-lucide' })
      } catch (err) {
        loadingMsg.style.display = 'none'
        errorMsg.textContent = `โหลดรอบเวลาไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = 'flex'
      }
    }

    nextBtn.addEventListener('click', () => {
      if (!selectedTimeslotId) return
      setFlow({
        item_id: itemId ? Number(itemId) : undefined,
        product_id: productId ? Number(productId) : undefined,
        timeslot_id: selectedTimeslotId,
      })
      const q = new URLSearchParams()
      if (itemId) q.set('item_id', itemId)
      if (productId) q.set('product_id', productId)
      q.set('timeslot_id', selectedTimeslotId)
      location.href = `checkout.html?${q.toString()}`
    })

    loadTimeslots()
    initPage()
  </script>
</body>
</html>

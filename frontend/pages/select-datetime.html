<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>นัดวัน-เวลา — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .day-group { margin-bottom: 18px; }
    .day-label { font-size: 13px; font-weight: 600; color: #3a3a3a; margin-bottom: 8px; }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }

    .slot-btn {
      padding: 10px 8px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      font-family: inherit;
      transition: all 0.15s;
    }
    .slot-btn .tech { display: block; font-size: 11px; color: var(--muted-2); margin-top: 2px; }
    .slot-btn:hover { border-color: var(--accent); }
    .slot-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-ink); font-weight: 500; }
    .slot-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }

    #empty-msg { display: none; text-align: center; padding: 14px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container container-md">
    <h1>เลือกวัน-เวลานัดหมาย</h1>
    <p class="subtitle">รอบเดียวจบ: ช่างจะมารับของเก่าและส่งของใหม่พร้อมกันในนัดหมายเดียว</p>

    <div class="card">
      <div id="slots-wrap"></div>
      <div class="msg-empty" id="empty-msg">ไม่มีช่วงเวลาว่างในตอนนี้ ลองกลับมาดูใหม่ภายหลัง</div>
    </div>

    <div class="msg msg-error" id="error-msg"></div>
    <button class="btn btn-primary btn-block" id="next-btn" disabled>ถัดไป: สรุปก่อนยืนยัน</button>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "" })

    const params = new URLSearchParams(location.search)
    const flow = getFlow()
    const itemId = params.get('item_id') || flow.item_id
    const productId = params.get('product_id') || flow.product_id

    const slotsWrap = document.getElementById('slots-wrap')
    const emptyMsg = document.getElementById('empty-msg')
    const nextBtn = document.getElementById('next-btn')
    const errorMsg = document.getElementById('error-msg')

    let selectedSlotId = null

    function formatSlot(dt) {
      const d = new Date(dt)
      return {
        day: d.toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', month: 'short' }),
        time: d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
      }
    }

    function selectSlot(id, btn) {
      selectedSlotId = id
      document.querySelectorAll('.slot-btn').forEach(b => b.classList.remove('selected'))
      btn.classList.add('selected')
      nextBtn.disabled = false
    }

    async function loadSlots() {
      errorMsg.style.display = 'none'
      slotsWrap.innerHTML = ''
      selectedSlotId = null
      nextBtn.disabled = true

      let slots
      try {
        slots = await getTimeslots()
      } catch (err) {
        errorMsg.textContent = `โหลดช่วงเวลาไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = 'block'
        return
      }

      // กันเวลาที่ผ่านไปแล้วอีกชั้นฝั่ง frontend เผื่อ clock ไม่ตรงกัน
      const now = new Date()
      slots = slots.filter(s => new Date(s.datetime) > now)

      if (slots.length === 0) {
        emptyMsg.style.display = 'block'
        return
      }
      emptyMsg.style.display = 'none'

      const byDay = {}
      for (const slot of slots) {
        const { day } = formatSlot(slot.datetime)
        byDay[day] = byDay[day] || []
        byDay[day].push(slot)
      }

      for (const [day, daySlots] of Object.entries(byDay)) {
        const group = document.createElement('div')
        group.className = 'day-group'
        group.innerHTML = `<div class="day-label">${day}</div>`
        const grid = document.createElement('div')
        grid.className = 'slot-grid'

        for (const slot of daySlots) {
          const { time } = formatSlot(slot.datetime)
          const btn = document.createElement('button')
          btn.type = 'button'
          btn.className = 'slot-btn'
          btn.innerHTML = `${time}<span class="tech">${slot.technician_name}</span>`
          btn.addEventListener('click', () => selectSlot(slot.id, btn))
          grid.appendChild(btn)
        }
        group.appendChild(grid)
        slotsWrap.appendChild(group)
      }
    }

    nextBtn.addEventListener('click', () => {
      errorMsg.style.display = 'none'

      if (!itemId) {
        errorMsg.textContent = 'ไม่พบรายการของเก่า กรุณากลับไปประเมินของเก่าใหม่'
        errorMsg.style.display = 'block'
        return
      }
      if (!selectedSlotId) return

      setFlow({ item_id: Number(itemId), product_id: productId ? Number(productId) : null, timeslot_id: selectedSlotId })
      const productParam = productId ? `&product_id=${productId}` : ''
      location.href = `checkout.html?item_id=${itemId}${productParam}&timeslot_id=${selectedSlotId}`
    })

    loadSlots()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลประเมิน — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .page-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
    }

    .result-photo {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--bg);
      margin-bottom: 20px;
    }
    .result-photo-empty {
      width: 100%;
      height: 120px;
      border-radius: var(--radius-sm);
      background: var(--bg);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--muted-2);
      margin-bottom: 20px;
    }

    .price-hero { text-align: center; margin-bottom: 8px; }
    .price-hero .value { font-size: 34px; font-weight: 700; color: var(--ok); }
    .price-hero .label { font-size: 13px; color: var(--muted); }

    .price-breakdown {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 20px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--muted); }
    .detail-row .value { font-weight: 500; }

    .co2-note {
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      margin: 16px 0 20px;
    }
    .co2-note strong { color: var(--ok); }

    .action-row { display: flex; flex-direction: column; gap: 10px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="page-wrap">
    <div class="auth-card" id="card">
      <div class="logo-standalone">THE DISPOSAL GUILT</div>
      <h1>ผลการประเมิน</h1>
      <p class="subtitle">นี่คือราคาและผลลัพธ์ที่คุณจะได้จากการส่งต่อของเก่าชิ้นนี้</p>

      <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูล...</div>
      <div class="msg msg-error" id="error-msg"></div>

      <div id="content" style="display: none;">
        <img class="result-photo" id="result-photo" style="display: none;" />
        <div class="result-photo-empty" id="result-photo-empty">ไม่มีรูปประกอบ</div>

        <div class="price-hero">
          <div class="value" id="price-value">-</div>
          <div class="label">ราคาประเมิน (ส่วนลดที่คุณจะได้รับ)</div>
        </div>
        <div class="price-breakdown" id="price-breakdown"></div>

        <div class="detail-row"><span class="label">ประเภท</span><span class="value" id="detail-type">-</span></div>
        <div class="detail-row"><span class="label">สภาพ</span><span class="value" id="detail-condition">-</span></div>
        <div class="detail-row" id="detail-desc-row" style="display: none;">
          <span class="label">รายละเอียด</span><span class="value" id="detail-desc">-</span>
        </div>

        <div class="co2-note">ช่วยลด CO₂ ได้ <strong id="detail-co2">-</strong> กก. จากการไม่ทิ้งของชิ้นนี้ลงบ่อขยะ</div>

        <div class="action-row">
          <button class="btn btn-primary btn-block" id="go-products-btn" style="margin-top: 0;">เลือกของใหม่เลย</button>
          <button class="btn btn-outline btn-block" id="go-again-btn" style="margin-top: 0;">ประเมินชิ้นอื่นอีก</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "assess" })

    const FURNITURE_LABEL = {
      sofa: "โซฟา", table: "โต๊ะ", chair: "เก้าอี้", bed: "เตียง",
      wardrobe: "ตู้เสื้อผ้า", shelf: "ชั้นวางของ", other: "อื่นๆ",
    }
    const CONDITION_LABEL = { good: "ดี", fair: "พอใช้", poor: "ทรุดโทรม" }

    // สูตรเดียวกับฝั่ง backend (items.py) — ใช้แค่อธิบายที่มาของราคาให้ผู้ใช้เห็น ไม่ได้คำนวณจริง
    const BASE_PRICE = { sofa: 3000, bed: 2500, wardrobe: 2000, table: 1500, chair: 800, shelf: 1000, other: 500 }
    const CONDITION_MULT = { good: 0.5, fair: 0.3, poor: 0.1 }

    const itemId = new URLSearchParams(location.search).get("id")

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const content = document.getElementById("content")

    async function load() {
      if (!itemId) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = "ไม่พบรหัสรายการ กรุณาประเมินของเก่าใหม่อีกครั้ง"
        errorMsg.style.display = "block"
        return
      }

      let item
      try {
        item = await getItem(itemId)
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "block"
        return
      }

      loadingMsg.style.display = "none"
      content.style.display = "block"

      if (item.photo_url) {
        const photo = document.getElementById("result-photo")
        photo.src = item.photo_url
        photo.style.display = "block"
        document.getElementById("result-photo-empty").style.display = "none"
      }

      document.getElementById("price-value").textContent = `${item.estimated_price.toLocaleString()} บาท`
      document.getElementById("detail-type").textContent = FURNITURE_LABEL[item.furniture_type] || item.furniture_type
      document.getElementById("detail-condition").textContent = CONDITION_LABEL[item.condition] || item.condition
      document.getElementById("detail-co2").textContent = item.co2_saved_kg.toFixed(1)

      const base = BASE_PRICE[item.furniture_type]
      const mult = CONDITION_MULT[item.condition]
      if (base !== undefined && mult !== undefined) {
        document.getElementById("price-breakdown").textContent =
          `ราคาฐาน ${base.toLocaleString()} บาท × ตัวคูณสภาพ ${Math.round(mult * 100)}% = ${item.estimated_price.toLocaleString()} บาท`
      }

      if (item.description) {
        document.getElementById("detail-desc").textContent = item.description
        document.getElementById("detail-desc-row").style.display = "flex"
      }

      document.getElementById("go-products-btn").addEventListener("click", () => {
        setFlow({ item_id: item.id })
        location.href = `products.html?item_id=${item.id}`
      })
    }

    document.getElementById("go-again-btn").addEventListener("click", () => {
      location.href = "assessment-form.html"
    })

    load()
  </script>
</body>
</html>

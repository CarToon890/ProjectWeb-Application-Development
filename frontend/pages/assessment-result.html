<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ผลการประเมินราคา — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .result-photo {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: var(--radius-lg);
      background: var(--bg);
      margin-bottom: var(--sp-5);
      border: 1px solid var(--border);
    }
    .result-photo-empty {
      width: 100%;
      height: 140px;
      border-radius: var(--radius-lg);
      background: var(--surface-2);
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: var(--sp-5);
    }
    .result-photo-empty svg { width: 28px; height: 28px; color: var(--muted-2); }

    .price-hero-card {
      background: linear-gradient(135deg, var(--ok-bg) 0%, rgba(59, 130, 246, 0.05) 100%);
      border: 1px solid var(--ok-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-6);
      text-align: center;
      margin-bottom: var(--sp-5);
    }
    .price-hero-card .value { font-size: 38px; font-weight: 800; color: var(--ok); line-height: 1.1; }
    .price-hero-card .label { font-size: 13px; color: var(--ok-ink); font-weight: 600; margin-top: 4px; }

    .detail-list {
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: var(--sp-4) var(--sp-5);
      border: 1px solid var(--border);
      margin-bottom: var(--sp-6);
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      padding: var(--sp-2) 0;
      border-bottom: 1px solid var(--border-light);
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--muted); }
    .detail-row .val { font-weight: 600; color: var(--ink); }

    .eco-banner {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-4);
      font-size: 13px;
      color: var(--ok-ink);
      display: flex;
      align-items: center;
      gap: var(--sp-2);
      margin-bottom: var(--sp-6);
    }
    .eco-banner svg { width: 18px; height: 18px; color: var(--ok); flex-shrink: 0; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-md">
      <div id="app-stepper"></div>

      <div class="card card-static" style="padding: var(--sp-8);">
        <div id="loading-msg" class="empty-state">กำลังประมวลผลข้อมูล...</div>
        <div class="msg msg-error" id="error-msg"></div>

        <div id="result-content" style="display: none;">
          <div style="text-align: center; margin-bottom: var(--sp-6);">
            <span class="badge badge-ok mb-sm"><i data-lucide="check-circle"></i> ประเมินราคาสำเร็จ</span>
            <h2>ส่วนลด Trade-in ของคุณพร้อมใช้งาน</h2>
            <p class="subtitle" style="margin-bottom: 0;">นำมูลค่านี้ไปเป็นส่วนลดในการเลือกซื้อเฟอร์นิเจอร์ชิ้นใหม่ได้ทันที</p>
          </div>

          <div id="photo-container"></div>

          <div class="price-hero-card">
            <div class="label">มูลค่าประเมิน (คูปองส่วนลด):</div>
            <div class="value" id="price-value">-</div>
            <div id="breakdown-text" style="font-size: 12px; color: var(--muted); margin-top: 6px;"></div>
          </div>

          <div class="eco-banner" id="co2-text"></div>

          <div class="detail-list">
            <div class="detail-row">
              <span class="label">รหัสรายการ</span>
              <span class="val" id="item-id">-</span>
            </div>
            <div class="detail-row">
              <span class="label">ประเภทเฟอร์นิเจอร์</span>
              <span class="val" id="furniture-type">-</span>
            </div>
            <div class="detail-row">
              <span class="label">ระดับสภาพ</span>
              <span class="val" id="condition">-</span>
            </div>
            <div class="detail-row" id="desc-row" style="display: none;">
              <span class="label">รายละเอียด</span>
              <span class="val" id="description" style="max-width: 60%; text-align: right;">-</span>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: var(--sp-3);">
            <button class="btn btn-primary btn-block btn-lg" id="choose-product-btn">
              <i data-lucide="shopping-bag"></i> ไปเลือกของใหม่ (รับส่วนลดชิ้นนี้)
            </button>
            <a href="assessment-form.html" class="btn btn-outline btn-block">
              <i data-lucide="rotate-ccw"></i> ประเมินเฟอร์นิเจอร์ชิ้นอื่นอีก
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "assess" })
    renderStepper(1)
    renderFooter({ root: "../", dir: "pages" })

    const FURNITURE_LABEL = {
      sofa: "โซฟา", table: "โต๊ะ", chair: "เก้าอี้", bed: "เตียง",
      wardrobe: "ตู้เสื้อผ้า", shelf: "ชั้นวางของ", other: "อื่นๆ",
    }
    const CONDITION_LABEL = { good: "ดี (50%)", fair: "พอใช้ (30%)", poor: "ทรุดโทรม (10%)" }
    const BASE_PRICE = { sofa: 3000, bed: 2500, wardrobe: 2000, table: 1500, chair: 800, shelf: 1000, other: 500 }
    const CONDITION_MULT_TEXT = { good: "× 0.5", fair: "× 0.3", poor: "× 0.1" }

    const params = new URLSearchParams(location.search)
    const itemId = params.get("id")

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const resultContent = document.getElementById("result-content")

    if (!itemId) {
      loadingMsg.style.display = "none"
      errorMsg.textContent = "ไม่พบรหัสรายการ กรุณากลับไปส่งประเมินใหม่"
      errorMsg.style.display = "flex"
    } else {
      getItem(itemId)
        .then((item) => {
          loadingMsg.style.display = "none"

          const photoContainer = document.getElementById("photo-container")
          if (item.photo_url) {
            photoContainer.innerHTML = `<img class="result-photo" src="${item.photo_url}" alt="รูปเฟอร์นิเจอร์" />`
          } else {
            photoContainer.innerHTML = `
              <div class="result-photo-empty">
                <i data-lucide="image"></i>
                <span>ไม่มีรูปถ่ายแนบมา</span>
              </div>
            `
          }

          document.getElementById("price-value").textContent = `${item.estimated_price.toLocaleString()} บาท`

          const base = BASE_PRICE[item.furniture_type] || 0
          const multText = CONDITION_MULT_TEXT[item.condition] || ""
          document.getElementById("breakdown-text").textContent =
            `คำนวณจากราคาฐาน ${base.toLocaleString()} บาท ${multText} ตามสภาพสินค้า`

          document.getElementById("co2-text").innerHTML = `
            <i data-lucide="leaf"></i>
            <span>ช่วยลดการปล่อย CO₂ ได้ <strong>${item.co2_saved_kg.toFixed(1)} กก.</strong> เมื่อเข้าสู่ระบบ Trade-in</span>
          `

          document.getElementById("item-id").textContent = `#${item.id}`
          document.getElementById("furniture-type").textContent = FURNITURE_LABEL[item.furniture_type] || item.furniture_type
          document.getElementById("condition").textContent = CONDITION_LABEL[item.condition] || item.condition

          if (item.description) {
            document.getElementById("description").textContent = item.description
            document.getElementById("desc-row").style.display = "flex"
          }

          document.getElementById("choose-product-btn").addEventListener("click", () => {
            setFlow({ item_id: item.id })
            location.href = `products.html?item_id=${item.id}`
          })

          resultContent.style.display = "block"
          if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
        })
        .catch((err) => {
          loadingMsg.style.display = "none"
          errorMsg.textContent = `โหลดผลประเมินไม่สำเร็จ: ${err.message}`
          errorMsg.style.display = "flex"
        })
    }

    initPage()
  </script>
</body>
</html>

<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตลาดเฟอร์นิเจอร์มือสอง</title><link rel="stylesheet" href="../css/main.css"><style>
.market-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:20px}.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.market-card img{width:100%;height:170px;object-fit:cover;border-radius:10px}.market-card{padding:14px}.chat-box{height:220px;overflow:auto;border:1px solid var(--border);padding:10px;border-radius:8px}.order{padding:12px;border-bottom:1px solid var(--border)}@media(max-width:800px){.market-layout{grid-template-columns:1fr}}
</style></head><body><div id="app-nav"></div><main class="main-content"><div class="container-xl"><header class="page-header"><div><h1>ตลาดเฟอร์นิเจอร์มือสอง</h1><p class="subtitle">ซื้อขายและพูดคุยกันในระบบ</p></div></header><div class="market-layout"><section><div class="card card-static"><h2>ลงประกาศขาย</h2><form id="listing-form"><div class="field"><label>ชื่อประกาศ</label><input name="title" required maxlength="120"></div><div class="grid-cols-2"><div class="field"><label>ประเภท</label><select name="furniture_type"><option value="sofa">โซฟา</option><option value="table">โต๊ะ</option><option value="chair">เก้าอี้</option><option value="bed">เตียง</option><option value="wardrobe">ตู้เสื้อผ้า</option><option value="shelf">ชั้นวาง</option><option value="other">อื่นๆ</option></select></div><div class="field"><label>สภาพ</label><select name="condition"><option value="good">ดี</option><option value="fair">พอใช้</option><option value="poor">ทรุดโทรม</option></select></div></div><div class="field"><label>รายละเอียด</label><textarea name="description" required></textarea></div><div class="grid-cols-2"><div class="field"><label>ราคา (บาท)</label><input name="price" type="number" min="1" required></div><div class="field"><label>รูปสินค้า</label><input name="photo" type="file" accept="image/*"></div></div><button class="btn btn-primary">ลงประกาศ</button><span id="form-msg"></span></form></div><h2 style="margin-top:24px">ประกาศที่ยังขายอยู่</h2><div class="field"><input id="search" placeholder="ค้นหาสินค้า..."></div><div class="market-grid" id="listings"></div></section><aside><div class="card card-static"><h2>แชต</h2><div id="chats"></div><div id="chat-panel" hidden><div id="chat-messages" class="chat-box"></div><form id="message-form"><input id="message" placeholder="พิมพ์ข้อความ..." required><button class="btn btn-primary">ส่ง</button></form></div></div><div class="card card-static" style="margin-top:16px"><h2>คำสั่งซื้อ</h2><div id="orders"></div></div></aside></div></div></main><div id="app-footer"></div><script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/components.js"></script><script>
requireLogin();renderNav({root:"../",active:"market"});renderFooter({root:"../",dir:"pages"});let activeChat=null;const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadListings(){const rows=await getMarketListings(document.getElementById('search').value);const root=document.getElementById('listings');root.innerHTML=rows.length?rows.map(x=>`<article class="card market-card">${x.image_url?`<img src="${esc(x.image_url)}" alt="">`:''}<h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><strong>฿${x.price.toLocaleString()}</strong><button class="btn btn-outline chat-start" data-id="${x.id}">เริ่มแชต</button><button class="btn btn-primary buy" data-id="${x.id}" data-price="${x.price}">ซื้อและแนบสลิป</button></article>`).join(''):'ยังไม่มีประกาศ';root.querySelectorAll('.chat-start').forEach(b=>b.onclick=async()=>{const r=await startMarketChat(b.dataset.id);await loadChats();openChat(r.chat.id)});root.querySelectorAll('.buy').forEach(b=>b.onclick=async()=>{const fee=Number(prompt('ค่าจัดส่ง (บาท)',0));if(!Number.isFinite(fee)||fee<0)return;const address=prompt('ที่อยู่จัดส่ง');if(!address)return;const f=document.createElement('input');f.type='file';f.accept='image/*';f.onchange=async()=>{try{const proof=await uploadImage(f.files[0]);await createMarketOrder(b.dataset.id,{shipping_fee:fee,address,payment_proof_url:proof.url});alert('ส่งคำสั่งซื้อและหลักฐานแล้ว รอผู้ขายตรวจสอบ');loadOrders();loadListings()}catch(e){alert(e.message)}};f.click()})}
async function loadChats(){const rows=await getMarketChats();document.getElementById('chats').innerHTML=rows.length?rows.map(c=>`<button class="btn btn-outline" data-id="${c.id}">ประกาศ #${c.listing_id} · ห้อง #${c.id}</button>`).join('<br>'):'ยังไม่มีห้องแชต';document.querySelectorAll('#chats button').forEach(b=>b.onclick=()=>openChat(Number(b.dataset.id)))}
async function openChat(id){activeChat=id;document.getElementById('chat-panel').hidden=false;await loadMessages()};async function loadMessages(){const r=await getMarketMessages(activeChat);document.getElementById('chat-messages').innerHTML=r.messages.map(m=>`<p><b>#${m.sender_id}</b> ${esc(m.body)}</p>`).join('');const box=document.getElementById('chat-messages');box.scrollTop=box.scrollHeight}
document.getElementById('message-form').onsubmit=async e=>{e.preventDefault();await sendMarketMessage(activeChat,document.getElementById('message').value);e.target.reset();loadMessages()};
async function loadOrders(){const rows=await getMarketOrders();document.getElementById('orders').innerHTML=rows.map(o=>`<div class="order"><b>คำสั่งซื้อ #${o.id}</b><p>สถานะ: ${esc(o.status)} · รวม ฿${(o.item_price+o.shipping_fee).toLocaleString()}</p>${o.payment_proof_url?`<a href="${esc(o.payment_proof_url)}" target="_blank">ดูหลักฐานโอน</a>`:''}${o.status==='awaiting_payment'?`<p><button class="btn btn-primary" data-ok="${o.id}">ยืนยันยอด</button><button class="btn btn-outline" data-no="${o.id}">ปฏิเสธ</button></p>`:''}${o.status==='paid'?`<p><button class="btn btn-outline" data-ship="${o.id}">บันทึกเลขพัสดุ</button></p>`:''}${o.status==='shipped'?`<p>พัสดุ ${esc(o.carrier)} ${esc(o.tracking_number)} ${o.buyer_id===Number(localStorage.getItem('user_id'))?`<button class="btn btn-primary" data-recv="${o.id}">ยืนยันรับ</button>`:''}</p>`:''}</div>`).join('')||'ยังไม่มีคำสั่งซื้อ';document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await apiFetch(`/api/market/orders/${b.dataset.ok}/payment`,jsonBody('PUT',{}));loadOrders()});document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{const reason=prompt('เหตุผลที่ปฏิเสธ');if(reason){await apiFetch(`/api/market/orders/${b.dataset.no}/payment`,jsonBody('PUT',{reason}));loadOrders();loadListings()}});document.querySelectorAll('[data-ship]').forEach(b=>b.onclick=async()=>{const carrier=prompt('บริษัทขนส่ง'),tracking_number=prompt('เลขพัสดุ');if(carrier&&tracking_number){await apiFetch(`/api/market/orders/${b.dataset.ship}/shipment`,jsonBody('PUT',{carrier,tracking_number}));loadOrders()}});document.querySelectorAll('[data-recv]').forEach(b=>b.onclick=async()=>{await apiFetch(`/api/market/orders/${b.dataset.recv}/received`,{method:'PUT'});loadOrders()})}
document.getElementById('listing-form').onsubmit=async e=>{e.preventDefault();const f=e.target;try{let image_url=null;if(f.photo.files[0])image_url=(await uploadImage(f.photo.files[0])).url;await createMarketListing({title:f.title.value,furniture_type:f.furniture_type.value,condition:f.condition.value,description:f.description.value,price:Number(f.price.value),image_url});f.reset();document.getElementById('form-msg').textContent=' ลงประกาศแล้ว';loadListings()}catch(err){document.getElementById('form-msg').textContent=' '+err.message}};document.getElementById('search').oninput=()=>loadListings();loadListings();loadChats();loadOrders();setInterval(()=>activeChat&&loadMessages(),5000);
</script></body></html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตลาดเฟอร์นิเจอร์มือสอง — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    .market-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
    .market-tools{display:flex;gap:10px;align-items:center;margin:20px 0}.market-tools input{flex:1}
    .market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
    .my-listings{margin:0 0 24px;padding:16px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface)}.my-listings h2{margin-top:0}.listing-status{display:inline-block;margin:4px 0 10px;padding:4px 9px;border-radius:999px;background:var(--surface-2);font-size:12px;color:var(--muted)}
    .listing-card{overflow:hidden}.listing-photo{height:180px;width:100%;object-fit:cover;background:var(--surface-2)}
    .listing-body{padding:16px}.listing-body h3{margin:0 0 8px}.listing-price{font-size:20px;font-weight:800;color:var(--ok);margin:10px 0}
    .listing-actions{display:flex;gap:8px;flex-wrap:wrap}.listing-actions .btn{flex:1}.market-sidebar{position:sticky;top:16px}
    .chat-list{display:grid;gap:8px;max-height:180px;overflow:auto;margin:12px 0}.chat-list button{text-align:left}
    .chat-box{height:240px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin:12px 0}
    .chat-message{margin:8px 0;overflow-wrap:anywhere}.chat-message.mine{text-align:right}.chat-message span{display:inline-block;padding:8px 11px;border-radius:12px;background:var(--surface-2);max-width:90%}.chat-message.mine span{background:var(--accent-bg)}
    .chat-send{display:flex;gap:8px}.chat-send input{min-width:0;flex:1}.order-card{border-top:1px solid var(--border);padding:12px 0}.order-card p{margin:5px 0}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.order-actions .btn{font-size:12px}
    .notice{margin:10px 0}.empty{color:var(--muted);padding:16px 0}.status-text{font-weight:700}.modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:1000;padding:16px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--surface);padding:22px;border-radius:var(--radius-lg)}
    .modal-backdrop[hidden]{display:none!important}
    @media(max-width:900px){.market-layout{grid-template-columns:1fr}.market-sidebar{position:static}.market-tools{flex-wrap:wrap}}
  </style>
</head>
<body>
  <div id="app-nav"></div>
  <main class="main-content"><div class="container-xl">
    <header class="page-header"><div class="page-header-main"><h1>ตลาดเฟอร์นิเจอร์มือสอง</h1><p class="subtitle">เลือกซื้อ ขาย และพูดคุยกันในระบบ</p></div><button class="btn btn-primary" id="open-listing">ลงประกาศขาย</button></header>
    <div id="page-error" class="msg msg-error" hidden></div>
    <div class="market-layout">
      <section>
        <div class="market-tools"><input id="search" type="search" placeholder="ค้นหาเฟอร์นิเจอร์"><select id="category"><option value="">ทุกประเภท</option><option value="sofa">โซฟา</option><option value="table">โต๊ะ</option><option value="chair">เก้าอี้</option><option value="bed">เตียง</option><option value="wardrobe">ตู้เสื้อผ้า</option><option value="shelf">ชั้นวาง</option><option value="other">อื่นๆ</option></select><button class="btn btn-outline" id="search-btn">ค้นหา</button></div>
        <section class="my-listings"><h2>ประกาศของฉัน</h2><div class="market-grid" id="my-listings"><p class="empty">กำลังโหลดประกาศของคุณ...</p></div></section>
        <div class="market-grid" id="listings"><p class="empty">กำลังโหลดประกาศ...</p></div>
        <section class="card card-static" style="margin-top:24px"><h2>คำสั่งซื้อของฉัน</h2><div id="orders"><p class="empty">กำลังโหลด...</p></div></section>
      </section>
      <aside class="market-sidebar"><div class="card card-static"><h2>แชตในระบบ</h2><p class="subtitle">ห้องสนทนาของคุณกับผู้ซื้อหรือผู้ขาย</p><div class="chat-list" id="chats"><span class="empty">กำลังโหลด...</span></div><div id="chat-panel" hidden><h3 id="chat-title">บทสนทนา</h3><div class="chat-box" id="chat-messages"></div><form class="chat-send" id="message-form"><input id="message" maxlength="2000" placeholder="พิมพ์ข้อความ..." required><button class="btn btn-primary">ส่ง</button></form></div></div></aside>
    </div>
  </div></main><div id="app-footer"></div>
  <div id="listing-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="listing-title"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="listing-title">ลงประกาศขาย</h2><button type="button" class="btn btn-outline" id="close-listing">ปิด</button></div><form id="listing-form"><div class="field"><label for="listing-name">ชื่อประกาศ</label><input id="listing-name" name="title" required minlength="2" maxlength="120"></div><div class="grid-cols-2"><div class="field"><label for="listing-type">ประเภท</label><select id="listing-type" name="furniture_type"><option value="sofa">โซฟา</option><option value="table">โต๊ะ</option><option value="chair">เก้าอี้</option><option value="bed">เตียง</option><option value="wardrobe">ตู้เสื้อผ้า</option><option value="shelf">ชั้นวาง</option><option value="other">อื่นๆ</option></select></div><div class="field"><label for="listing-condition">สภาพ</label><select id="listing-condition" name="condition"><option value="good">ดี</option><option value="fair">พอใช้</option><option value="poor">ทรุดโทรม</option></select></div></div><div class="field"><label for="listing-description">รายละเอียด</label><textarea id="listing-description" name="description" required maxlength="3000"></textarea></div><div class="grid-cols-2"><div class="field"><label for="listing-price">ราคา (บาท)</label><input id="listing-price" name="price" type="number" min="1" step="1" required></div><div class="field"><label for="listing-photo">รูปสินค้า</label><input id="listing-photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div></div><div id="listing-error" class="msg msg-error" hidden></div><button class="btn btn-primary btn-block" id="listing-submit">ลงประกาศ</button></form></section></div>
  <div id="order-modal" class="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true"><div style="display:flex;justify-content:space-between;align-items:center"><h2>สั่งซื้อสินค้า</h2><button type="button" class="btn btn-outline" id="close-order">ปิด</button></div><p id="order-summary"></p><form id="order-form"><input type="hidden" id="order-listing-id"><div class="field"><label for="shipping-fee">ค่าจัดส่ง (บาท)</label><input id="shipping-fee" type="number" min="0" step="1" value="0" required></div><div class="field"><label for="shipping-address">ที่อยู่จัดส่ง</label><textarea id="shipping-address" required minlength="5" maxlength="1000"></textarea></div><div class="field"><label for="payment-proof">หลักฐานการโอน</label><input id="payment-proof" type="file" accept="image/jpeg,image/png,image/webp,image/gif" required></div><div id="order-error" class="msg msg-error" hidden></div><button class="btn btn-primary btn-block" id="order-submit">ส่งคำสั่งซื้อ</button></form></section></div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/components.js"></script>
  <script>
    requireLogin(); renderNav({root:"../",active:"market"}); renderFooter({root:"../",dir:"pages"});
    const $=id=>document.getElementById(id); const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    const typeNames={sofa:"โซฟา",table:"โต๊ะ",chair:"เก้าอี้",bed:"เตียง",wardrobe:"ตู้เสื้อผ้า",shelf:"ชั้นวาง",other:"อื่นๆ"};
    const statusNames={awaiting_payment:"รอตรวจสอบการโอน",payment_rejected:"หลักฐานถูกปฏิเสธ",paid:"ชำระแล้ว รอจัดส่ง",shipped:"จัดส่งแล้ว",completed:"รับสินค้าแล้ว",refunded:"คืนเงินแล้ว"};
    const listingStatusNames={available:"กำลังขาย",reserved:"มีผู้สั่งซื้อแล้ว",sold:"ขายแล้ว"};
    let currentUser=null,activeChat=null,chatTimer=null,searchTimer=null;
    function pageError(message){$("page-error").textContent=message;$("page-error").hidden=!message}
    function uploadedFile(input){return input.files&&input.files[0]}
    async function loadListings(){
      const root=$("listings");root.innerHTML='<p class="empty">กำลังโหลดประกาศ...</p>';
      try{const rows=await getMarketListings($("search").value.trim(),$("category").value);const visible=rows.filter(row=>row.seller_id!==currentUser.id);root.innerHTML=visible.length?visible.map(row=>`<article class="card listing-card">${row.image_url?`<img class="listing-photo" src="${escapeHtml(row.image_url)}" alt="${escapeHtml(row.title)}" loading="lazy">`:'<div class="listing-photo" aria-label="ไม่มีรูปสินค้า"></div>'}<div class="listing-body"><span class="badge badge-muted">${escapeHtml(typeNames[row.furniture_type]||row.furniture_type)} · ${escapeHtml({good:"ดี",fair:"พอใช้",poor:"ทรุดโทรม"}[row.condition]||row.condition)}</span><h3>${escapeHtml(row.title)}</h3><p>${escapeHtml(row.description)}</p><div class="listing-price">฿${Number(row.price).toLocaleString()}</div><div class="listing-actions"><button class="btn btn-outline" data-chat="${row.id}">แชตผู้ขาย</button><button class="btn btn-primary" data-buy="${row.id}" data-price="${row.price}" data-title="${escapeHtml(row.title)}">ซื้อ</button></div></div></article>`).join(""):'<p class="empty">ไม่พบประกาศที่ตรงกับการค้นหา</p>';root.querySelectorAll("[data-chat]").forEach(button=>button.onclick=()=>startChat(Number(button.dataset.chat)));root.querySelectorAll("[data-buy]").forEach(button=>button.onclick=()=>showOrder(Number(button.dataset.buy),button.dataset.title,Number(button.dataset.price)));}
      catch(error){root.innerHTML=`<p class="empty">โหลดประกาศไม่สำเร็จ: ${escapeHtml(error.message)}</p>`}
    }
    async function loadMyListings(){const root=$("my-listings");try{const rows=await getMyMarketListings();root.innerHTML=rows.length?rows.map(row=>`<article class="card listing-card">${row.image_url?`<img class="listing-photo" src="${escapeHtml(row.image_url)}" alt="${escapeHtml(row.title)}" loading="lazy">`:'<div class="listing-photo" aria-label="ไม่มีรูปสินค้า"></div>'}<div class="listing-body"><span class="listing-status">${escapeHtml(listingStatusNames[row.status]||row.status)}</span><h3>${escapeHtml(row.title)}</h3><p>${escapeHtml(row.description)}</p><div class="listing-price">฿${Number(row.price).toLocaleString()}</div></div></article>`).join(""):'<p class="empty">คุณยังไม่ได้ลงประกาศขาย</p>'}catch(error){root.innerHTML=`<p class="empty">โหลดประกาศของคุณไม่สำเร็จ: ${escapeHtml(error.message)}</p>`}}
    async function startChat(listingId){try{const result=await startMarketChat(listingId);await loadChats();await openChat(result.chat.id)}catch(error){pageError(error.message)}}
    async function loadChats(){const root=$("chats");try{const chats=await getMarketChats();root.innerHTML=chats.length?chats.map(chat=>`<button type="button" class="btn btn-outline" data-open-chat="${chat.id}">ประกาศ #${chat.listing_id} · ห้อง #${chat.id}</button>`).join(""):'<span class="empty">ยังไม่มีห้องแชต เลือก “แชตผู้ขาย” จากประกาศเพื่อเริ่มคุย</span>';root.querySelectorAll("[data-open-chat]").forEach(button=>button.onclick=()=>openChat(Number(button.dataset.openChat)))}catch(error){root.innerHTML=`<span class="empty">${escapeHtml(error.message)}</span>`}}
    async function openChat(id){activeChat=id;$("chat-panel").hidden=false;$("chat-title").textContent=`บทสนทนา · ห้อง #${id}`;await loadMessages()}
    async function loadMessages(){if(!activeChat)return;try{const result=await getMarketMessages(activeChat);$("chat-messages").innerHTML=result.messages.map(message=>`<div class="chat-message ${message.sender_id===currentUser.id?"mine":""}"><span><small>${message.sender_id===currentUser.id?"ฉัน":"คู่สนทนา"}</small><br>${escapeHtml(message.body)}</span></div>`).join("")||'<p class="empty">เริ่มบทสนทนาได้เลย</p>';const box=$("chat-messages");box.scrollTop=box.scrollHeight}catch(error){$("chat-messages").textContent=error.message}}
    $("message-form").onsubmit=async event=>{event.preventDefault();const input=$("message");const text=input.value.trim();if(!text||!activeChat)return;try{await sendMarketMessage(activeChat,text);input.value="";await loadMessages()}catch(error){pageError(error.message)}};
    function showOrder(id,title,price){$("order-listing-id").value=id;$("order-summary").textContent=`${title} · ฿${price.toLocaleString()} (ยังไม่รวมค่าจัดส่ง)`;$("order-form").reset();$("order-listing-id").value=id;$("order-error").hidden=true;$("order-modal").hidden=false}
    $("close-order").onclick=()=>$("order-modal").hidden=true;$("order-modal").onclick=event=>{if(event.target===$("order-modal"))$("order-modal").hidden=true};
    $("order-form").onsubmit=async event=>{event.preventDefault();const button=$("order-submit"),proof=uploadedFile($("payment-proof"));if(!proof)return;button.disabled=true;$("order-error").hidden=true;try{const upload=await uploadImage(proof);await createMarketOrder(Number($("order-listing-id").value),{shipping_fee:Number($("shipping-fee").value),address:$("shipping-address").value.trim(),payment_proof_url:upload.url});$("order-modal").hidden=true;await Promise.all([loadOrders(),loadListings()]);pageError("")}catch(error){$("order-error").textContent=error.message;$("order-error").hidden=false}finally{button.disabled=false}};
    async function loadOrders(){const root=$("orders");try{const orders=await getMarketOrders();root.innerHTML=orders.length?orders.map(order=>{const isSeller=order.seller_id===currentUser.id;const status=statusNames[order.status]||order.status;return `<article class="order-card"><b>คำสั่งซื้อ #${order.id}</b><p>${isSeller?"คุณเป็นผู้ขาย":"คุณเป็นผู้ซื้อ"} · ประกาศ #${order.listing_id}</p><p>สินค้า ฿${Number(order.item_price).toLocaleString()} + ส่ง ฿${Number(order.shipping_fee).toLocaleString()} = <b>฿${(order.item_price+order.shipping_fee).toLocaleString()}</b></p><p class="status-text">${escapeHtml(status)}</p>${order.payment_proof_url?`<a href="${escapeHtml(order.payment_proof_url)}" target="_blank" rel="noopener">เปิดหลักฐานโอน</a>`:""}${order.rejection_reason?`<p>เหตุผล: ${escapeHtml(order.rejection_reason)}</p>`:""}${order.carrier?`<p>ขนส่ง: ${escapeHtml(order.carrier)} · เลขพัสดุ: ${escapeHtml(order.tracking_number)}</p>`:""}${order.refund_reason?`<p>เหตุผลคืนเงิน: ${escapeHtml(order.refund_reason)} · <a href="${escapeHtml(order.refund_proof_url)}" target="_blank" rel="noopener">หลักฐานคืนเงิน</a></p>`:""}<div class="order-actions">${isSeller&&order.status==="awaiting_payment"?`<button class="btn btn-primary" data-approve="${order.id}">ยืนยันยอดโอน</button><button class="btn btn-outline" data-reject="${order.id}">ปฏิเสธหลักฐาน</button>`:""}${isSeller&&order.status==="paid"?`<button class="btn btn-outline" data-ship="${order.id}">บันทึกเลขพัสดุ</button><button class="btn btn-outline" data-refund="${order.id}">บันทึกคืนเงิน</button>`:""}${isSeller&&order.status==="shipped"?`<button class="btn btn-outline" data-refund="${order.id}">บันทึกคืนเงิน</button>`:""}${!isSeller&&order.status==="shipped"?`<button class="btn btn-primary" data-received="${order.id}">ยืนยันรับสินค้า</button>`:""}</div></article>`}).join(""):'<p class="empty">ยังไม่มีคำสั่งซื้อ</p>';bindOrderActions()}catch(error){root.innerHTML=`<p class="empty">โหลดคำสั่งซื้อไม่สำเร็จ: ${escapeHtml(error.message)}</p>`}}
    function bindOrderActions(){document.querySelectorAll("[data-approve]").forEach(button=>button.onclick=()=>updatePayment(button.dataset.approve,{}));document.querySelectorAll("[data-reject]").forEach(button=>button.onclick=()=>{const reason=prompt("ระบุเหตุผลที่ปฏิเสธหลักฐาน");if(reason&&reason.trim())updatePayment(button.dataset.reject,{reason:reason.trim()})});document.querySelectorAll("[data-ship]").forEach(button=>button.onclick=async()=>{const carrier=prompt("บริษัทขนส่ง"),tracking_number=prompt("เลขพัสดุ");if(carrier&&tracking_number)try{await apiFetch(`/api/market/orders/${button.dataset.ship}/shipment`,jsonBody("PUT",{carrier:carrier.trim(),tracking_number:tracking_number.trim()}));await loadOrders()}catch(error){pageError(error.message)}});document.querySelectorAll("[data-received]").forEach(button=>button.onclick=async()=>{if(!confirm("ยืนยันว่าได้รับสินค้าแล้ว?"))return;try{await apiFetch(`/api/market/orders/${button.dataset.received}/received`,{method:"PUT"});await loadOrders()}catch(error){pageError(error.message)}});document.querySelectorAll("[data-refund]").forEach(button=>button.onclick=async()=>{const reason=prompt("เหตุผลการคืนเงิน"),input=document.createElement("input");if(!reason)return;input.type="file";input.accept="image/*";input.onchange=async()=>{if(!input.files[0])return;try{const proof=await uploadImage(input.files[0]);await apiFetch(`/api/market/orders/${button.dataset.refund}/refund`,jsonBody("PUT",{reason:reason.trim(),proof_url:proof.url}));await Promise.all([loadOrders(),loadListings()])}catch(error){pageError(error.message)}};input.click()})}
    async function updatePayment(id,data){try{await apiFetch(`/api/market/orders/${id}/payment`,jsonBody("PUT",data));await Promise.all([loadOrders(),loadListings()])}catch(error){pageError(error.message)}}
    $("open-listing").onclick=()=>{$("listing-form").reset();$("listing-error").hidden=true;$("listing-modal").hidden=false};$("close-listing").onclick=()=>$("listing-modal").hidden=true;$("listing-modal").onclick=event=>{if(event.target===$("listing-modal"))$("listing-modal").hidden=true};
    $("listing-form").onsubmit=async event=>{event.preventDefault();const form=event.currentTarget,button=$("listing-submit");button.disabled=true;$("listing-error").hidden=true;try{let image_url=null;const photo=uploadedFile(form.elements.namedItem("photo"));if(photo)image_url=(await uploadImage(photo)).url;await createMarketListing({title:form.elements.namedItem("title").value.trim(),furniture_type:form.elements.namedItem("furniture_type").value,condition:form.elements.namedItem("condition").value,description:form.elements.namedItem("description").value.trim(),price:Number(form.elements.namedItem("price").value),image_url});$("listing-modal").hidden=true;await Promise.all([loadListings(),loadMyListings()]);pageError("")}catch(error){$("listing-error").textContent=error.message;$("listing-error").hidden=false}finally{button.disabled=false}};
    $("search-btn").onclick=loadListings;$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadListings,250)};$("category").onchange=loadListings;
    (async()=>{try{currentUser=await getMe();await Promise.all([loadListings(),loadMyListings(),loadChats(),loadOrders()]);chatTimer=setInterval(loadMessages,5000)}catch(error){pageError(error.message)}})();
  </script>
</body></html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>รายละเอียดสินค้า — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 640px) {
      .detail-grid { grid-template-columns: 1fr; }
    }

    .product-photo {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: var(--radius-md);
      background: var(--bg);
    }

    .product-category { font-size: 12px; color: var(--muted-2); margin-bottom: 4px; }
    .product-stock { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

    .calc-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border-light);
    }
    .calc-row.total { border-bottom: none; padding-top: 12px; font-size: 17px; font-weight: 700; }
    .calc-row.total .value { color: var(--ok); }
    .calc-row.total .value.negative { color: var(--danger); }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container container-lg">
    <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูล...</div>
    <div class="msg msg-error" id="error-msg"></div>

    <div class="detail-grid" id="content" style="display: none;">
      <div>
        <img class="product-photo" id="product-photo" />
      </div>
      <div>
        <div class="product-category" id="product-category">-</div>
        <h1 id="product-name">-</h1>
        <p class="product-stock" id="product-stock">-</p>

        <div class="card">
          <div class="calc-row"><span>ราคาสินค้า</span><span id="calc-price">-</span></div>
          <div class="calc-row"><span>ส่วนลดจากของเก่า</span><span id="calc-discount">-</span></div>
          <div class="calc-row total"><span>ยอดสุทธิ</span><span class="value" id="calc-total">-</span></div>
        </div>

        <div class="msg msg-error" id="select-error-msg"></div>
        <button class="btn btn-primary btn-block" id="select-btn" style="margin-top: 4px;">เลือกชิ้นนี้</button>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "" })

    const params = new URLSearchParams(location.search)
    const productId = params.get("id")
    const itemId = params.get("item_id") || getFlow().item_id

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const content = document.getElementById("content")
    const selectErrorMsg = document.getElementById("select-error-msg")

    let estimatedPrice = 0
    let product = null

    async function loadDiscount() {
      if (!itemId) return
      try {
        const item = await getItem(itemId)
        estimatedPrice = item.estimated_price
      } catch (err) {
        // โหลดส่วนลดไม่ได้ก็แสดงราคาเต็มไปก่อน ไม่บล็อกหน้า
      }
    }

    function renderCalc() {
      const finalPrice = product.price - estimatedPrice
      document.getElementById("calc-price").textContent = `${product.price.toLocaleString()} บาท`
      document.getElementById("calc-discount").textContent = `-${estimatedPrice.toLocaleString()} บาท`
      const totalEl = document.getElementById("calc-total")
      totalEl.textContent = `${finalPrice.toLocaleString()} บาท${finalPrice < 0 ? " (ทางร้านจ่ายคืน)" : ""}`
      totalEl.classList.toggle("negative", finalPrice < 0)
    }

    async function load() {
      if (!productId) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = "ไม่พบรหัสสินค้า"
        errorMsg.style.display = "block"
        return
      }

      await loadDiscount()

      try {
        product = await getProduct(productId)
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลสินค้าไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "block"
        return
      }

      loadingMsg.style.display = "none"
      content.style.display = "grid"

      const photo = document.getElementById("product-photo")
      photo.src = product.image_url || ""
      photo.alt = product.name
      photo.onerror = () => { photo.style.display = "none" }

      document.getElementById("product-name").textContent = product.name
      document.getElementById("product-category").textContent = product.category
      document.getElementById("product-stock").textContent = `เหลือ ${product.stock} ชิ้น`
      renderCalc()

      const selectBtn = document.getElementById("select-btn")
      if (product.stock <= 0) {
        selectBtn.disabled = true
        selectBtn.textContent = "สินค้าหมด"
      }

      selectBtn.addEventListener("click", () => {
        if (!itemId) {
          selectErrorMsg.textContent = "ไม่พบรายการของเก่า กรุณากลับไปประเมินของเก่าใหม่"
          selectErrorMsg.style.display = "block"
          return
        }
        setFlow({ item_id: Number(itemId), product_id: product.id })
        location.href = `select-datetime.html?item_id=${itemId}&product_id=${product.id}`
      })
    }

    load()
  </script>
</body>
</html>

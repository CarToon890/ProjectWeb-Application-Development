<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>โปรไฟล์ — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .container { max-width: 520px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container">
    <h1>โปรไฟล์</h1>
    <p class="subtitle">แก้ไขข้อมูลส่วนตัวและรหัสผ่านของคุณ</p>

    <form id="profile-form" class="card">
      <h2>ข้อมูลส่วนตัว</h2>

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" disabled />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required />
      </div>

      <div class="field">
        <label for="full_name">ชื่อ-นามสกุล</label>
        <input type="text" name="full_name" id="full_name" required />
      </div>

      <div class="field">
        <label for="phone">เบอร์โทร</label>
        <input type="tel" name="phone" id="phone" />
      </div>

      <div class="field">
        <label for="address">ที่อยู่</label>
        <input type="text" name="address" id="address" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="save-btn">บันทึกข้อมูล</button>
      <div class="msg msg-error" id="profile-error"></div>
      <div class="msg msg-success" id="profile-success"></div>
    </form>

    <form id="password-form" class="card">
      <h2>เปลี่ยนรหัสผ่าน</h2>

      <div class="field">
        <label for="old_password">รหัสผ่านเดิม</label>
        <input type="password" name="old_password" id="old_password" required autocomplete="current-password" />
      </div>

      <div class="field">
        <label for="new_password">รหัสผ่านใหม่</label>
        <input type="password" name="new_password" id="new_password" required minlength="6" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="password-btn">เปลี่ยนรหัสผ่าน</button>
      <div class="msg msg-error" id="password-error"></div>
      <div class="msg msg-success" id="password-success"></div>
    </form>

    <div class="card" id="admin-panel-card" style="display: none;">
      <h2>สิทธิ์ผู้ดูแลระบบ</h2>
      <a href="../admin/index.html" class="btn btn-outline btn-block" style="text-decoration: none; text-align: center; display: block;">เข้าสู่หลังบ้าน (Admin)</a>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "profile" })

    let currentUserId = null
    const profileForm = document.getElementById('profile-form')
    const saveBtn = document.getElementById('save-btn')
    const profileError = document.getElementById('profile-error')
    const profileSuccess = document.getElementById('profile-success')

    async function loadProfile() {
      try {
        const me = await getMe()
        currentUserId = me.id
        cacheRole(me.role)
        document.getElementById('username').value = me.username
        document.getElementById('email').value = me.email
        document.getElementById('full_name').value = me.full_name
        document.getElementById('phone').value = me.phone || ''
        document.getElementById('address').value = me.address || ''

        if (me.role === 'admin') {
          document.getElementById('admin-panel-card').style.display = 'block'
        }
      } catch (err) {
        profileError.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        profileError.style.display = 'block'
      }
    }

    profileForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      profileError.style.display = 'none'
      profileSuccess.style.display = 'none'
      saveBtn.disabled = true

      try {
        await updateUser(currentUserId, {
          email: profileForm.email.value.trim(),
          full_name: profileForm.full_name.value.trim(),
          phone: profileForm.phone.value.trim() || null,
          address: profileForm.address.value.trim() || null,
        })
        profileSuccess.textContent = 'บันทึกข้อมูลสำเร็จ'
        profileSuccess.style.display = 'block'
      } catch (err) {
        profileError.textContent = `บันทึกไม่สำเร็จ: ${err.message}`
        profileError.style.display = 'block'
      } finally {
        saveBtn.disabled = false
      }
    })

    const passwordForm = document.getElementById('password-form')
    const passwordBtn = document.getElementById('password-btn')
    const passwordError = document.getElementById('password-error')
    const passwordSuccess = document.getElementById('password-success')

    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault()
      passwordError.style.display = 'none'
      passwordSuccess.style.display = 'none'
      passwordBtn.disabled = true

      try {
        await changePassword(passwordForm.old_password.value, passwordForm.new_password.value)
        passwordSuccess.textContent = 'เปลี่ยนรหัสผ่านสำเร็จ'
        passwordSuccess.style.display = 'block'
        passwordForm.reset()
      } catch (err) {
        passwordError.textContent = `เปลี่ยนรหัสผ่านไม่สำเร็จ: ${err.message}`
        passwordError.style.display = 'block'
      } finally {
        passwordBtn.disabled = false
      }
    })

    loadProfile()
  </script>
</body>
</html>

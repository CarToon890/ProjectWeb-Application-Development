<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eco Dashboard — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .category-list {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow);
    }
    .category-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .category-row:last-child { margin-bottom: 0; }
    .category-name { width: 90px; flex-shrink: 0; color: #3a3a3a; }
    .bar-track { flex: 1; height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; background: var(--ok); }
    .category-count { width: 32px; text-align: right; font-weight: 500; flex-shrink: 0; }

    .empty { font-size: 13px; color: var(--muted-2); padding: 12px 0; }

    .tree-note {
      margin-top: 14px;
      background: var(--ok-bg);
      border: 1px solid var(--ok-border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--ok-ink);
      text-align: center;
      display: none;
    }
    .tree-note strong { font-size: 15px; }

    .share-btn { margin-top: 24px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container">
    <h1>Eco Dashboard</h1>
    <p class="subtitle">ผลลัพธ์เชิงสิ่งแวดล้อมจากการส่งต่อของเก่าแทนการทิ้ง</p>

    <div class="section-title">ของคุณ</div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-value" id="me-items">-</div>
        <div class="stat-label">ชิ้นที่ส่งต่อแล้ว</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="me-co2">-</div>
        <div class="stat-label">กก. CO₂ ที่ประหยัดได้</div>
      </div>
    </div>
    <div class="category-list" id="me-categories" style="margin-top: 14px;"></div>
    <div class="tree-note" id="tree-note"></div>

    <div class="section-title">รวมทั้งระบบ</div>
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-value" id="total-items">-</div>
        <div class="stat-label">ชิ้นที่ส่งต่อแล้ว</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-co2">-</div>
        <div class="stat-label">กก. CO₂ ที่ประหยัดได้</div>
      </div>
    </div>
    <div class="category-list" id="total-categories" style="margin-top: 14px;"></div>

    <button class="btn btn-primary share-btn" id="share-btn">แชร์ผลลัพธ์ของฉัน</button>
    <div class="msg msg-error" id="error-msg"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "eco" })

    const CATEGORY_LABEL = {
      sofa: 'โซฟา', table: 'โต๊ะ', chair: 'เก้าอี้', bed: 'เตียง',
      wardrobe: 'ตู้เสื้อผ้า', shelf: 'ชั้นวางของ', other: 'อื่นๆ',
    }

    function renderCategories(container, byCategory) {
      const entries = Object.entries(byCategory)
      if (entries.length === 0) {
        container.innerHTML = '<div class="empty">ยังไม่มีข้อมูล</div>'
        return
      }
      const max = Math.max(...entries.map(([, count]) => count))
      container.innerHTML = entries.map(([cat, count]) => `
        <div class="category-row">
          <div class="category-name">${CATEGORY_LABEL[cat] || cat}</div>
          <div class="bar-track"><div class="bar-fill" style="width: ${(count / max) * 100}%"></div></div>
          <div class="category-count">${count}</div>
        </div>
      `).join('')
    }

    // ต้นไม้ 1 ต้นดูดซับ CO2 ได้ราว 21 กก./ปี (ค่าเฉลี่ยที่มักอ้างอิงกัน) — ใช้แค่เทียบให้เห็นภาพ ไม่ใช่ตัวเลขวิทยาศาสตร์แม่นยำ
    const TREE_CO2_KG_PER_YEAR = 21

    let meStats = null

    async function load() {
      try {
        const [me, total] = await Promise.all([getEcoStatsMe(), getEcoStats()])
        meStats = me

        document.getElementById('me-items').textContent = me.total_items
        document.getElementById('me-co2').textContent = me.total_co2_saved_kg.toFixed(1)
        renderCategories(document.getElementById('me-categories'), me.by_category)

        const treeNote = document.getElementById('tree-note')
        if (me.total_co2_saved_kg > 0) {
          const trees = Math.max(1, Math.round(me.total_co2_saved_kg / TREE_CO2_KG_PER_YEAR))
          treeNote.innerHTML = `🌳 เทียบเท่ากับการปลูกต้นไม้ <strong>${trees}</strong> ต้น ที่ดูดซับ CO₂ ได้ 1 ปี`
          treeNote.style.display = 'block'
        }

        document.getElementById('total-items').textContent = total.total_items
        document.getElementById('total-co2').textContent = total.total_co2_saved_kg.toFixed(1)
        renderCategories(document.getElementById('total-categories'), total.by_category)
      } catch (err) {
        document.getElementById('error-msg').textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        document.getElementById('error-msg').style.display = 'block'
      }
    }

    document.getElementById('share-btn').addEventListener('click', async () => {
      const text = meStats
        ? `ฉันช่วยลดขยะไปแล้ว ${meStats.total_items} ชิ้น ประหยัด CO₂ ได้ ${meStats.total_co2_saved_kg.toFixed(1)} กก. กับ The Disposal Guilt!`
        : 'ผลลัพธ์เชิงสิ่งแวดล้อมของฉันกับ The Disposal Guilt'

      if (navigator.share) {
        try { await navigator.share({ text }) } catch (e) { /* ผู้ใช้ปิด share sheet เอง ไม่ต้องแจ้ง error */ }
      } else {
        try {
          await navigator.clipboard.writeText(text)
          toast('คัดลอกข้อความสำหรับแชร์แล้ว', 'success')
        } catch (e) {
          toast(text, 'info', 5000)
        }
      }
    })

    load()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ขั้นตอนที่ 1: ประเมินของเก่า — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .type-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--sp-2);
    }
    @media (max-width: 520px) {
      .type-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .type-btn {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3) var(--sp-2);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      background: var(--surface);
      transition: all var(--transition-fast);
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--ink);
    }
    .type-btn i, .type-btn svg { width: 24px; height: 24px; color: var(--muted); transition: color var(--transition-fast); }
    .type-btn:hover { border-color: var(--accent); transform: translateY(-1px); }
    .type-btn:hover i, .type-btn:hover svg { color: var(--accent); }
    .type-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-ink); font-weight: 700; box-shadow: 0 0 0 2px var(--accent-border); }
    .type-btn.selected i, .type-btn.selected svg { color: var(--accent); }

    .condition-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--sp-2);
    }
    @media (max-width: 520px) {
      .condition-grid { grid-template-columns: 1fr; }
    }

    .condition-btn {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-3);
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      background: var(--surface);
      transition: all var(--transition-fast);
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--ink);
    }
    .condition-btn i, .condition-btn svg { width: 22px; height: 22px; margin-bottom: 4px; color: var(--muted); transition: color var(--transition-fast); }
    .condition-btn .cond-desc { font-size: 11px; color: var(--muted); display: block; margin-top: 3px; font-weight: 400; line-height: 1.3; }
    .condition-btn:hover { border-color: var(--accent); }
    .condition-btn:hover i, .condition-btn:hover svg { color: var(--accent); }
    .condition-btn.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-ink); font-weight: 700; box-shadow: 0 0 0 2px var(--accent-border); }
    .condition-btn.selected i, .condition-btn.selected svg { color: var(--accent); }
    .condition-btn.selected .cond-desc { color: var(--accent-ink); opacity: 0.9; }

    input[name="furniture_type"], input[name="condition"] { display: none; }

    .price-preview-card {
      background: linear-gradient(135deg, var(--accent-bg) 0%, rgba(5, 150, 105, 0.08) 100%);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-5);
      text-align: center;
      margin-bottom: var(--sp-5);
      display: none;
    }
    .price-preview-card .value { font-size: 24px; font-weight: 800; color: var(--accent-ink); }
    .price-preview-card .label { font-size: 12px; color: var(--accent-ink); font-weight: 500; }

    .photo-upload-area {
      border: 2px dashed var(--border);
      border-radius: var(--radius-md);
      padding: var(--sp-6) var(--sp-4);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--surface-2);
    }
    .photo-upload-area:hover { border-color: var(--accent); background: var(--accent-bg); }
    .photo-upload-area .hint { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .photo-upload-area .hint i, .photo-upload-area .hint svg { width: 28px; height: 28px; color: var(--accent); }
    .photo-preview {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: var(--radius-md);
      display: none;
      margin-bottom: var(--sp-3);
      border: 1px solid var(--border);
    }
    .photo-status { font-size: 12px; margin-top: 6px; display: none; }
    .photo-status.uploading { color: var(--muted); }
    .photo-status.done { color: var(--ok-ink); font-weight: 600; }
    .photo-status.failed { color: var(--danger); font-weight: 600; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-md">
      <!-- Stepper Wizard -->
      <div id="app-stepper"></div>

      <div class="card card-static" style="padding: var(--sp-8);">
        <div style="margin-bottom: var(--sp-6);">
          <span class="badge badge-accent mb-sm"><i data-lucide="camera"></i> ขั้นตอนที่ 1</span>
          <h2>ส่งข้อมูลประเมินเฟอร์นิเจอร์เก่า</h2>
          <p class="subtitle" style="margin-bottom: 0;">เลือกประเภทและสภาพเพื่อรับราคาประเมินและคูปองส่วนลดซื้อของใหม่</p>
        </div>

        <form id="assessment-form">
          <!-- 1. ประเภทเฟอร์นิเจอร์ -->
          <div class="field">
            <label>1. เลือกประเภทเฟอร์นิเจอร์ <span style="color: var(--danger);">*</span></label>
            <div class="type-grid" id="type-grid"></div>
            <input type="text" name="furniture_type" id="furniture_type" required />
          </div>

          <!-- 2. สภาพสินค้า -->
          <div class="field">
            <label>2. เลือกระดับสภาพสินค้า <span style="color: var(--danger);">*</span></label>
            <div class="condition-grid" id="condition-grid"></div>
            <input type="text" name="condition" id="condition" required />
          </div>

          <!-- Price Preview -->
          <div class="price-preview-card" id="price-preview">
            <div class="label">ราคาประเมินและส่วนลดที่จะได้รับ:</div>
            <div class="value" id="price-preview-value">-</div>
            <div style="font-size: 12px; color: var(--ok); margin-top: 4px;">
              <i data-lucide="leaf" style="width: 13px; height: 13px; vertical-align: middle;"></i> พร้อมร่วมเป็นส่วนหนึ่งในการลดก๊าซ CO₂
            </div>
          </div>

          <!-- 3. รูปถ่าย -->
          <div class="field">
            <label>3. รูปถ่ายเฟอร์นิเจอร์ (ไม่บังคับ แต่ช่วยให้ช่างตรวจสอบได้ง่ายขึ้น)</label>
            <img class="photo-preview" id="photo-preview" />
            <div class="photo-upload-area" id="photo-upload-area">
              <div class="hint">
                <i data-lucide="upload-cloud"></i>
                <span>คลิกหรือแตะเพื่อเลือกรูปภาพจากเครื่อง</span>
                <span style="font-size: 11px; color: var(--muted-2);">รองรับ JPG, PNG (ขนาดไม่เกิน 10MB)</span>
              </div>
            </div>
            <input type="file" id="photo-input" accept="image/*" style="display: none;" />
            <div class="photo-status" id="photo-status"></div>
          </div>

          <!-- 4. รายละเอียดเพิ่มเติม -->
          <div class="field">
            <label for="description">4. รายละเอียดเพิ่มเติม (ไม่บังคับ)</label>
            <textarea name="description" id="description"
              placeholder="เช่น โซฟาผ้า 3 ที่นั่ง สีเทา ขาไม้ ไม่มีรอยขาด ใช้งานมาประมาณ 3 ปี"></textarea>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">
            <i data-lucide="check-circle"></i> ยืนยันการประเมินราคา
          </button>

          <div class="msg msg-error" id="error-msg"></div>
          <div class="msg msg-success" id="success-msg"></div>
        </form>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "assess" })
    renderStepper(1)
    renderFooter({ root: "../", dir: "pages" })

    const FURNITURE_TYPES = [
      ["sofa", "โซฟา", "sofa"],
      ["table", "โต๊ะ", "utensils-crossed"],
      ["chair", "เก้าอี้", "armchair"],
      ["bed", "เตียง", "bed-double"],
      ["wardrobe", "ตู้เสื้อผ้า", "door-open"],
      ["shelf", "ชั้นวางของ", "book-open"],
      ["other", "อื่นๆ", "box"],
    ]
    const CONDITIONS = [
      ["good", "สภาพดี", "smile", "ใช้งานได้ปกติ ไม่มีตำหนิเด่นชัด"],
      ["fair", "สภาพพอใช้", "meh", "มีร่องรอยการใช้งานบ้าง ยังแข็งแรง"],
      ["poor", "สภาพทรุดโทรม", "frown", "มีตำหนิชัดเจน เหมาะแก่นำไปรีไซเคิล"],
    ]

    const BASE_PRICE = { sofa: 3000, bed: 2500, wardrobe: 2000, table: 1500, chair: 800, shelf: 1000, other: 500 }
    const CONDITION_MULT = { good: 0.5, fair: 0.3, poor: 0.1 }

    const typeGrid = document.getElementById("type-grid")
    const conditionGrid = document.getElementById("condition-grid")
    const typeInput = document.getElementById("furniture_type")
    const conditionInput = document.getElementById("condition")
    const pricePreview = document.getElementById("price-preview")
    const pricePreviewValue = document.getElementById("price-preview-value")

    function updatePricePreview() {
      const base = BASE_PRICE[typeInput.value]
      const mult = CONDITION_MULT[conditionInput.value]
      if (base === undefined || mult === undefined) {
        pricePreview.style.display = "none"
        return
      }
      pricePreviewValue.textContent = `${Math.round(base * mult).toLocaleString()} บาท`
      pricePreview.style.display = "block"
      if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
    }

    typeGrid.innerHTML = FURNITURE_TYPES.map(([value, label, icon]) => `
      <div class="type-btn" data-value="${value}">
        <i data-lucide="${icon}"></i>
        <span>${label}</span>
      </div>
    `).join("")

    typeGrid.querySelectorAll(".type-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        typeGrid.querySelectorAll(".type-btn").forEach((b) => b.classList.remove("selected"))
        btn.classList.add("selected")
        typeInput.value = btn.dataset.value
        updatePricePreview()
      })
    })

    conditionGrid.innerHTML = CONDITIONS.map(([value, label, icon, desc]) => `
      <div class="condition-btn" data-value="${value}">
        <i data-lucide="${icon}"></i>
        <span>${label}</span>
        <span class="cond-desc">${desc}</span>
      </div>
    `).join("")

    conditionGrid.querySelectorAll(".condition-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        conditionGrid.querySelectorAll(".condition-btn").forEach((b) => b.classList.remove("selected"))
        btn.classList.add("selected")
        conditionInput.value = btn.dataset.value
        updatePricePreview()
      })
    })

    // Upload photo
    let uploadedPhotoUrl = null
    let photoUploading = false
    const photoUploadArea = document.getElementById("photo-upload-area")
    const photoInput = document.getElementById("photo-input")
    const photoPreview = document.getElementById("photo-preview")
    const photoStatus = document.getElementById("photo-status")

    photoUploadArea.addEventListener("click", () => photoInput.click())

    photoInput.addEventListener("change", async () => {
      const file = photoInput.files[0]
      if (!file) return

      photoPreview.src = URL.createObjectURL(file)
      photoPreview.style.display = "block"
      photoUploadArea.style.display = "none"

      photoUploading = true
      photoStatus.className = "photo-status uploading"
      photoStatus.textContent = "กำลังอัปโหลดรูปภาพ..."
      photoStatus.style.display = "block"

      try {
        const res = await uploadImage(file)
        uploadedPhotoUrl = res.url
        photoStatus.className = "photo-status done"
        photoStatus.textContent = "✓ อัปโหลดรูปสำเร็จ"
      } catch (err) {
        photoStatus.className = "photo-status failed"
        photoStatus.textContent = `อัปโหลดไม่สำเร็จ: ${err.message}`
        uploadedPhotoUrl = null
      } finally {
        photoUploading = false
      }
    })

    // Form submit
    const form = document.getElementById("assessment-form")
    const submitBtn = document.getElementById("submit-btn")
    const errorMsg = document.getElementById("error-msg")
    const successMsg = document.getElementById("success-msg")

    form.addEventListener("submit", async (e) => {
      e.preventDefault()
      errorMsg.style.display = "none"
      successMsg.style.display = "none"

      if (!typeInput.value) {
        errorMsg.textContent = "กรุณาเลือกประเภทเฟอร์นิเจอร์"
        errorMsg.style.display = "flex"
        return
      }
      if (!conditionInput.value) {
        errorMsg.textContent = "กรุณาเลือกระดับสภาพสินค้า"
        errorMsg.style.display = "flex"
        return
      }
      if (photoUploading) {
        errorMsg.textContent = "กรุณารอรูปภาพอัปโหลดเสร็จสิ้นก่อน"
        errorMsg.style.display = "flex"
        return
      }

      submitBtn.disabled = true
      submitBtn.innerHTML = "กำลังประมวลผล..."

      try {
        const item = await createItem({
          furniture_type: typeInput.value,
          condition: conditionInput.value,
          description: form.description.value || null,
          photo_url: uploadedPhotoUrl,
        })

        successMsg.innerHTML = `
          <strong><i data-lucide="check-circle"></i> ส่งข้อมูลสำเร็จ!</strong>
          ราคาประเมิน: <strong>${item.estimated_price.toLocaleString()} บาท</strong> (กำลังพาไปดูผล...)
        `
        successMsg.style.display = "flex"
        if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })

        setTimeout(() => {
          location.href = `assessment-result.html?id=${item.id}`
        }, 1000)
      } catch (err) {
        errorMsg.textContent = `ส่งข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "flex"
        submitBtn.disabled = false
        submitBtn.innerHTML = '<i data-lucide="check-circle"></i> ยืนยันการประเมินราคา'
        if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
      }
    })

    initPage()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกของใหม่ — The Disposal Guilt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      background: #f5f5f0;
      color: #1a1a1a;
      min-height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      padding: 14px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    nav .logo { font-size: 13px; color: #6b6b6b; letter-spacing: 0.04em; }
    nav .links { display: flex; gap: 18px; align-items: center; font-size: 13px; }
    nav .links a { color: #3a3a3a; text-decoration: none; }
    nav .links a:hover { color: #3b7dd8; }
    nav button {
      background: none; border: none; font-size: 13px; color: #b91c1c; cursor: pointer; font-family: inherit;
    }

    .container { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

    h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .subtitle { font-size: 14px; color: #6b6b6b; margin-bottom: 20px; }

    .discount-banner {
      background: #eef4ff;
      border: 1px solid #b8d1f5;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      color: #1a52a8;
      margin-bottom: 24px;
    }
    .discount-banner strong { font-size: 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
    }

    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
      margin-bottom: 10px;
    }

    .product-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .product-category { font-size: 11px; color: #9a9a9a; margin-bottom: 8px; }
    .price-row { font-size: 13px; color: #6b6b6b; margin-bottom: 2px; }
    .price-row .price { text-decoration: line-through; color: #9a9a9a; }
    .final-price { font-size: 16px; font-weight: 700; color: #16a34a; margin-bottom: 10px; }
    .final-price.negative { color: #b91c1c; }

    .select-btn {
      margin-top: auto;
      padding: 9px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .select-btn:hover { opacity: 0.85; }
    .select-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .category-filter {
      margin-bottom: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-filter button {
      padding: 6px 14px;
      border: 1.5px solid #ddd;
      border-radius: 20px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .category-filter button.active {
      border-color: #1a1a1a;
      background: #1a1a1a;
      color: #fff;
    }

    #error-msg, #empty-msg {
      display: none;
      background: #fff0f0;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: #b91c1c;
      margin-bottom: 16px;
    }
    #empty-msg { background: #f5f5f0; border-color: #ddd; color: #6b6b6b; }
  </style>
</head>
<body>
  <nav>
    <div class="logo">THE DISPOSAL GUILT</div>
    <div class="links">
      <a href="../index.html">หน้าแรก</a>
      <a href="eco-dashboard.html">Eco Dashboard</a>
      <a href="profile.html">โปรไฟล์</a>
      <button onclick="handleLogout()">ออกจากระบบ</button>
    </div>
  </nav>

  <div class="container">
    <h1>เลือกของใหม่</h1>
    <p class="subtitle">เลือกสินค้าที่อยากได้ แล้วใช้ส่วนลดจากของเก่าที่ประเมินไว้</p>

    <div class="discount-banner" id="discount-banner" style="display: none;"></div>
    <div id="error-msg"></div>
    <div id="empty-msg">ไม่พบสินค้าในหมวดนี้</div>

    <div class="category-filter" id="category-filter"></div>
    <div class="grid" id="product-grid"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    requireLogin()

    const params = new URLSearchParams(location.search)
    const itemId = params.get('item_id')
    const errorMsg = document.getElementById('error-msg')
    const emptyMsg = document.getElementById('empty-msg')
    const grid = document.getElementById('product-grid')
    const banner = document.getElementById('discount-banner')
    const categoryFilter = document.getElementById('category-filter')

    const CATEGORIES = [
      ['', 'ทั้งหมด'], ['sofa', 'โซฟา'], ['table', 'โต๊ะ'], ['chair', 'เก้าอี้'],
      ['bed', 'เตียง'], ['wardrobe', 'ตู้เสื้อผ้า'], ['shelf', 'ชั้นวางของ'],
    ]

    let estimatedPrice = 0

    function showError(message) {
      errorMsg.textContent = message
      errorMsg.style.display = 'block'
    }

    async function loadItemDiscount() {
      if (!itemId) return
      try {
        const item = await getItem(itemId)
        estimatedPrice = item.estimated_price
        banner.innerHTML = `รายการ <strong>#${item.id}</strong> (${item.furniture_type}) ได้ส่วนลด <strong>${estimatedPrice.toLocaleString()} บาท</strong> จากการประเมิน`
        banner.style.display = 'block'
      } catch (err) {
        showError(`โหลดข้อมูลรายการของเก่าไม่สำเร็จ: ${err.message}`)
      }
    }

    function renderProducts(products) {
      grid.innerHTML = ''
      emptyMsg.style.display = products.length === 0 ? 'block' : 'none'

      for (const p of products) {
        const finalPrice = p.price - estimatedPrice
        const card = document.createElement('div')
        card.className = 'product-card'
        card.innerHTML = `
          <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.style.display='none'" />
          <div class="product-name">${p.name}</div>
          <div class="product-category">${p.category} · เหลือ ${p.stock} ชิ้น</div>
          <div class="price-row">ราคาสินค้า: <span class="price">${p.price.toLocaleString()} บาท</span></div>
          <div class="final-price ${finalPrice < 0 ? 'negative' : ''}">
            ยอดที่ต้องจ่าย: ${finalPrice.toLocaleString()} บาท
          </div>
          <button class="select-btn" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock <= 0 ? 'สินค้าหมด' : 'เลือกสินค้านี้'}
          </button>
        `
        card.querySelector('.select-btn').addEventListener('click', () => {
          if (!itemId) {
            showError('ไม่พบ item_id กรุณากลับไปประเมินของเก่าใหม่')
            return
          }
          location.href = `select-datetime.html?item_id=${itemId}&product_id=${p.id}`
        })
        grid.appendChild(card)
      }
    }

    async function loadProducts(category) {
      try {
        const products = await getProducts(category || undefined)
        renderProducts(products)
      } catch (err) {
        showError(`โหลดสินค้าไม่สำเร็จ: ${err.message}`)
      }
    }

    function renderCategoryFilter() {
      categoryFilter.innerHTML = ''
      CATEGORIES.forEach(([value, label], idx) => {
        const btn = document.createElement('button')
        btn.textContent = label
        if (idx === 0) btn.classList.add('active')
        btn.addEventListener('click', () => {
          categoryFilter.querySelectorAll('button').forEach(b => b.classList.remove('active'))
          btn.classList.add('active')
          loadProducts(value)
        })
        categoryFilter.appendChild(btn)
      })
    }

    renderCategoryFilter()
    loadItemDiscount().then(() => loadProducts(''))
  </script>
</body>
</html>

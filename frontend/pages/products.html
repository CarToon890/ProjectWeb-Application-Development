<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เลือกของใหม่ — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .discount-banner {
      background: var(--accent-bg);
      border: 1px solid var(--accent-border);
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 14px;
      color: var(--accent-ink);
      margin-bottom: 24px;
      position: sticky;
      top: 12px;
      z-index: 10;
    }
    .discount-banner strong { font-size: 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 18px;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }

    .product-card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: #eee;
      margin-bottom: 10px;
    }

    .product-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .product-category { font-size: 11px; color: var(--muted-2); margin-bottom: 8px; }
    .price-row { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
    .price-row .price { text-decoration: line-through; color: var(--muted-2); }
    .final-price { font-size: 16px; font-weight: 700; color: var(--ok); margin-bottom: 10px; }
    .final-price.negative { color: var(--danger); }

    .select-btn { margin-top: auto; width: 100%; }

    .category-filter {
      margin-bottom: 18px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .category-filter button {
      padding: 6px 14px;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .category-filter button.active {
      border-color: var(--ink);
      background: var(--ink);
      color: #fff;
    }

    #error-msg { margin-bottom: 16px; }
    #empty-msg { display: none; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container container-lg">
    <h1>เลือกของใหม่</h1>
    <p class="subtitle">เลือกสินค้าที่อยากได้ แล้วใช้ส่วนลดจากของเก่าที่ประเมินไว้</p>

    <div class="discount-banner" id="discount-banner" style="display: none;"></div>
    <div class="msg msg-error" id="error-msg"></div>
    <div class="msg-empty" id="empty-msg" style="padding: 10px 14px; border-radius: 8px;">ไม่พบสินค้าในหมวดนี้</div>

    <div class="category-filter" id="category-filter"></div>
    <div class="grid" id="product-grid"></div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "" })

    const params = new URLSearchParams(location.search)
    const itemId = params.get('item_id') || getFlow().item_id
    const errorMsg = document.getElementById('error-msg')
    const emptyMsg = document.getElementById('empty-msg')
    const grid = document.getElementById('product-grid')
    const banner = document.getElementById('discount-banner')
    const categoryFilter = document.getElementById('category-filter')

    const CATEGORIES = [
      ['', 'ทั้งหมด'], ['sofa', 'โซฟา'], ['table', 'โต๊ะ'], ['chair', 'เก้าอี้'],
      ['bed', 'เตียง'], ['wardrobe', 'ตู้เสื้อผ้า'], ['shelf', 'ชั้นวางของ'],
    ]

    let estimatedPrice = 0

    function showError(message) {
      errorMsg.textContent = message
      errorMsg.style.display = 'block'
    }

    async function loadItemDiscount() {
      if (!itemId) return
      try {
        const item = await getItem(itemId)
        estimatedPrice = item.estimated_price
        banner.innerHTML = `รายการ <strong>#${item.id}</strong> (${item.furniture_type}) ได้ส่วนลด <strong>${estimatedPrice.toLocaleString()} บาท</strong> จากการประเมิน`
        banner.style.display = 'block'
      } catch (err) {
        showError(`โหลดข้อมูลรายการของเก่าไม่สำเร็จ: ${err.message}`)
      }
    }

    function renderProducts(products) {
      grid.innerHTML = ''
      emptyMsg.style.display = products.length === 0 ? 'block' : 'none'

      for (const p of products) {
        const finalPrice = p.price - estimatedPrice
        const card = document.createElement('div')
        card.className = 'product-card'
        card.innerHTML = `
          <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.style.display='none'" />
          <div class="product-name">${p.name}</div>
          <div class="product-category">${p.category} · เหลือ ${p.stock} ชิ้น</div>
          <div class="price-row">ราคาสินค้า: <span class="price">${p.price.toLocaleString()} บาท</span></div>
          <div class="final-price ${finalPrice < 0 ? 'negative' : ''}">
            ยอดที่ต้องจ่าย: ${finalPrice.toLocaleString()} บาท
          </div>
          <button class="btn btn-primary select-btn" ${p.stock <= 0 ? 'disabled' : ''}>
            ${p.stock <= 0 ? 'สินค้าหมด' : 'เลือกสินค้านี้'}
          </button>
        `
        card.addEventListener('click', () => {
          location.href = `product-detail.html?id=${p.id}${itemId ? `&item_id=${itemId}` : ''}`
        })
        card.querySelector('.select-btn').addEventListener('click', (e) => {
          e.stopPropagation()
          if (!itemId) {
            showError('ไม่พบ item_id กรุณากลับไปประเมินของเก่าใหม่')
            return
          }
          setFlow({ item_id: Number(itemId), product_id: p.id })
          location.href = `select-datetime.html?item_id=${itemId}&product_id=${p.id}`
        })
        grid.appendChild(card)
      }
    }

    async function loadProducts(category) {
      try {
        const products = await getProducts(category || undefined)
        renderProducts(products)
      } catch (err) {
        showError(`โหลดสินค้าไม่สำเร็จ: ${err.message}`)
      }
    }

    function renderCategoryFilter() {
      categoryFilter.innerHTML = ''
      CATEGORIES.forEach(([value, label], idx) => {
        const btn = document.createElement('button')
        btn.textContent = label
        if (idx === 0) btn.classList.add('active')
        btn.addEventListener('click', () => {
          categoryFilter.querySelectorAll('button').forEach(b => b.classList.remove('active'))
          btn.classList.add('active')
          loadProducts(value)
        })
        categoryFilter.appendChild(btn)
      })
    }

    renderCategoryFilter()
    loadItemDiscount().then(() => loadProducts(''))
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>แคตตาล็อกสินค้าใหม่ — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .discount-banner-sticky {
      background: linear-gradient(135deg, var(--accent-bg) 0%, rgba(5, 150, 105, 0.1) 100%);
      border: 1.5px solid var(--accent-border);
      border-radius: var(--radius-lg);
      padding: var(--sp-4) var(--sp-6);
      font-size: 14px;
      color: var(--accent-ink);
      margin-bottom: var(--sp-6);
      position: sticky;
      top: calc(var(--nav-height) + 12px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(8px);
    }
    .discount-banner-sticky svg { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }

    .category-pills {
      display: flex;
      gap: var(--sp-2);
      flex-wrap: wrap;
      margin-bottom: var(--sp-6);
    }
    .category-pill {
      padding: var(--sp-2) var(--sp-4);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--surface);
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-2);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition-fast);
    }
    .category-pill:hover { border-color: var(--accent); color: var(--accent); }
    .category-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: var(--sp-6);
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--sp-4);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--accent-border);
    }

    .product-card-img-wrap {
      width: 100%;
      height: 180px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--surface-2);
      margin-bottom: var(--sp-3);
      position: relative;
    }
    .product-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-stock-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }

    .product-name { font-size: 15px; font-weight: 700; margin-bottom: 2px; color: var(--ink); line-height: 1.3; }
    .product-category { font-size: 12px; color: var(--muted); margin-bottom: var(--sp-3); }

    .price-box {
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: var(--sp-3);
      margin-bottom: var(--sp-4);
      margin-top: auto;
      border: 1px solid var(--border-light);
    }
    .price-original { font-size: 12px; color: var(--muted); text-decoration: line-through; }
    .price-final { font-size: 18px; font-weight: 800; color: var(--accent); }
    .price-final.discounted { color: var(--ok); }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <!-- Stepper Wizard -->
      <div id="app-stepper"></div>

      <!-- Sticky Trade-in Discount Banner -->
      <div class="discount-banner-sticky" id="discount-banner" style="display: none;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <i data-lucide="tag"></i>
          <span id="discount-banner-text">-</span>
        </div>
        <span class="badge badge-ok"><i data-lucide="check"></i> ใช้ส่วนลดอัตโนมัติ</span>
      </div>

      <div class="page-header">
        <div class="page-header-main">
          <h1>แคตตาล็อกเฟอร์นิเจอร์ใหม่</h1>
          <p class="subtitle" style="margin-bottom: 0;">เลือกซื้อสินค้าคุณภาพดี พร้อมส่วนลด Trade-in หักลบยอดทันที</p>
        </div>
      </div>

      <!-- Categories Filter Toolbar -->
      <div class="category-pills" id="category-pills"></div>

      <div class="msg msg-error" id="error-msg"></div>
      <div id="loading-msg" class="empty-state">กำลังโหลดแคตตาล็อกสินค้า...</div>

      <!-- Products Grid -->
      <div class="product-grid" id="product-grid"></div>
      <div class="empty-state" id="empty-msg" style="display: none;">
        <i data-lucide="package-search"></i>
        <div>ไม่พบสินค้าในหมวดหมู่นี้</div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/flow.js"></script>
  <script>
    renderNav({ root: "../", active: "products" })
    renderFooter({ root: "../", dir: "pages" })

    const CATEGORIES = [
      { key: "", label: "ทั้งหมด", icon: "layout-grid" },
      { key: "sofa", label: "โซฟา", icon: "sofa" },
      { key: "table", label: "โต๊ะ", icon: "utensils-crossed" },
      { key: "chair", label: "เก้าอี้", icon: "armchair" },
      { key: "bed", label: "เตียง", icon: "bed-double" },
      { key: "wardrobe", label: "ตู้เสื้อผ้า", icon: "door-open" },
      { key: "shelf", label: "ชั้นวางของ", icon: "book-open" },
    ]

    const params = new URLSearchParams(location.search)
    const itemId = params.get('item_id') || getFlow().item_id

    if (itemId) {
      renderStepper(2)
    }

    const grid = document.getElementById('product-grid')
    const banner = document.getElementById('discount-banner')
    const bannerText = document.getElementById('discount-banner-text')
    const categoryPillsEl = document.getElementById('category-pills')
    const emptyMsg = document.getElementById('empty-msg')
    const loadingMsg = document.getElementById('loading-msg')
    const errorMsg = document.getElementById('error-msg')

    let activeCategory = ''
    let estimatedPrice = 0

    function renderCategoryPills() {
      categoryPillsEl.innerHTML = CATEGORIES.map(c => `
        <button class="category-pill ${c.key === activeCategory ? 'active' : ''}" data-cat="${c.key}">
          <i data-lucide="${c.icon}"></i>
          <span>${c.label}</span>
        </button>
      `).join('')

      categoryPillsEl.querySelectorAll('.category-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          categoryPillsEl.querySelectorAll('.category-pill').forEach(b => b.classList.remove('active'))
          btn.classList.add('active')
          activeCategory = btn.dataset.cat
          loadProducts(activeCategory)
        })
      })

      if (typeof lucide !== 'undefined') lucide.createIcons({ nameAttr: 'data-lucide' })
    }

    async function loadItemDiscount() {
      if (!itemId) return
      try {
        const item = await getItem(itemId)
        estimatedPrice = item.estimated_price
        bannerText.innerHTML = `คุณมีส่วนลด Trade-in <strong>฿${estimatedPrice.toLocaleString()} บาท</strong> จากรายการ #${item.id} (${item.furniture_type})`
        banner.style.display = 'flex'
        if (typeof lucide !== 'undefined') lucide.createIcons({ nameAttr: 'data-lucide' })
      } catch (err) {
        // Not a blocking error
      }
    }

    function renderProducts(products) {
      grid.innerHTML = ''
      loadingMsg.style.display = 'none'
      emptyMsg.style.display = products.length === 0 ? 'block' : 'none'

      for (const p of products) {
        const finalPrice = p.price - estimatedPrice
        const card = document.createElement('div')
        card.className = 'product-card'
        card.innerHTML = `
          <div class="product-card-img-wrap">
            <img src="${p.image_url || ''}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=400&q=80'" />
            <div class="product-stock-tag ${p.stock <= 0 ? 'badge-danger' : ''}">
              ${p.stock > 0 ? `คงเหลือ ${p.stock} ชิ้น` : 'สินค้าหมด'}
            </div>
          </div>
          <div class="product-name">${p.name}</div>
          <div class="product-category">หมวดหมู่: ${p.category}</div>

          <div class="price-box">
            ${estimatedPrice > 0 ? `
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="price-original">ราคาเต็ม: ฿${p.price.toLocaleString()}</span>
                <span style="font-size:11px; color:var(--ok); font-weight:700;">- ฿${estimatedPrice.toLocaleString()}</span>
              </div>
              <div style="font-size:12px; color:var(--ink-2); margin-top:2px;">ยอดจ่ายสุทธิ:</div>
              <div class="price-final discounted">${finalPrice <= 0 ? 'ฟรี (ได้เงินคืน ฿' + Math.abs(finalPrice).toLocaleString() + ')' : '฿' + finalPrice.toLocaleString() + ' บาท'}</div>
            ` : `
              <div style="font-size:12px; color:var(--muted);">ราคาจำหน่าย:</div>
              <div class="price-final">฿${p.price.toLocaleString()} บาท</div>
            `}
          </div>

          <button class="btn btn-primary select-btn" ${p.stock <= 0 ? 'disabled' : ''} style="width:100%;">
            ${p.stock <= 0 ? 'สินค้าหมด' : '<i data-lucide="shopping-cart"></i> เลือกสินค้านี้'}
          </button>
        `

        card.addEventListener('click', () => {
          location.href = `product-detail.html?id=${p.id}${itemId ? `&item_id=${itemId}` : ''}`
        })

        card.querySelector('.select-btn').addEventListener('click', (e) => {
          e.stopPropagation()
          if (!itemId) {
            // Can choose to buy or evaluate old furniture first
            location.href = `select-datetime.html?product_id=${p.id}`
            return
          }
          setFlow({ item_id: Number(itemId), product_id: p.id })
          location.href = `select-datetime.html?item_id=${itemId}&product_id=${p.id}`
        })

        grid.appendChild(card)
      }

      if (typeof lucide !== 'undefined') lucide.createIcons({ nameAttr: 'data-lucide' })
    }

    async function loadProducts(category = '') {
      loadingMsg.style.display = 'block'
      grid.innerHTML = ''
      try {
        const products = await getProducts(category)
        renderProducts(products)
      } catch (err) {
        loadingMsg.style.display = 'none'
        errorMsg.textContent = `โหลดสินค้าไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = 'flex'
      }
    }

    renderCategoryPills()
    loadItemDiscount()
    loadProducts()
    initPage()
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ของเก่าของฉัน — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--sp-6);
    }

    .item-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: var(--sp-5);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      border-left: 4px solid var(--accent);
      display: flex;
      flex-direction: column;
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    }
    .item-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .item-card.assessed { border-left-color: var(--accent); }
    .item-card.picked_up { border-left-color: var(--ok); }
    .item-card.donated { border-left-color: var(--ok); }

    .item-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: var(--sp-3);
      padding-bottom: var(--sp-2);
      border-bottom: 1px solid var(--border-light);
    }
    .item-title { font-size: 16px; font-weight: 700; color: var(--ink); }
    .item-price { font-size: 22px; font-weight: 800; color: var(--ok); margin: var(--sp-2) 0; }
    .item-desc { font-size: 12px; color: var(--muted); margin-bottom: var(--sp-4); line-height: 1.5; }

    .item-actions { display: flex; gap: var(--sp-2); margin-top: auto; }
    .item-actions .btn { flex: 1; padding: 8px 12px; font-size: 12px; }

    .edit-panel {
      margin-top: var(--sp-4);
      padding-top: var(--sp-4);
      border-top: 1px dashed var(--border);
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      padding: var(--sp-3);
    }
    .condition-mini { display: flex; gap: 6px; }
    .condition-mini button {
      flex: 1;
      padding: 6px 4px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      color: var(--ink);
      transition: all var(--transition-fast);
    }
    .condition-mini button:hover { border-color: var(--accent); }
    .condition-mini button.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-ink); font-weight: 700; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <div class="page-header">
        <div class="page-header-main">
          <h1><i data-lucide="archive" style="vertical-align: middle; color: var(--accent); margin-right: 8px;"></i>ของเก่าของฉัน</h1>
          <p class="subtitle" style="margin-bottom: 0;">รายการเฟอร์นิเจอร์เก่าที่คุณเคยส่งประเมินไว้ทั้งหมด</p>
        </div>
        <div class="toolbar">
          <a href="assessment-form.html" class="btn btn-primary btn-sm"><i data-lucide="camera"></i> ประเมินชิ้นใหม่</a>
        </div>
      </div>

      <div class="status-filter" id="status-filter"></div>
      <div class="msg msg-error" id="error-msg"></div>

      <div class="empty-state" id="empty-msg" style="display: none;">
        <i data-lucide="archive"></i>
        <div style="font-size: 16px; font-weight: 600; margin-bottom: 8px;">ไม่พบรายการของเก่า</div>
        <a href="assessment-form.html" class="btn btn-primary" style="margin-top: 8px;">
          <i data-lucide="camera"></i> เริ่มส่งประเมินเฟอร์นิเจอร์ชิ้นแรก
        </a>
      </div>

      <div class="items-grid" id="item-grid"></div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    requireLogin()
    renderNav({ root: "../", active: "myitems" })
    renderFooter({ root: "../", dir: "pages" })

    const FURNITURE_LABEL = {
      sofa: "โซฟา", table: "โต๊ะ", chair: "เก้าอี้", bed: "เตียง",
      wardrobe: "ตู้เสื้อผ้า", shelf: "ชั้นวางของ", other: "อื่นๆ",
    }
    const CONDITION_LABEL = { good: "ดี", fair: "พอใช้", poor: "ทรุดโทรม" }
    const STATUSES = ["pending", "assessed", "scheduled", "picked_up", "donated"]
    const STATUS_LABEL = {
      pending: "รอตรวจสอบ", assessed: "ประเมินแล้ว", scheduled: "นัดหมายแล้ว",
      picked_up: "รับของแล้ว", donated: "ส่งต่อสำเร็จ",
    }
    const STATUS_BADGE_CLASS = {
      pending: "badge-warning", assessed: "badge-accent", scheduled: "badge-accent",
      picked_up: "badge-ok", donated: "badge-ok",
    }
    const STATUS_FILTERS = [["", "ทั้งหมด"], ...STATUSES.map((s) => [s, STATUS_LABEL[s]])]

    const grid = document.getElementById("item-grid")
    const emptyMsg = document.getElementById("empty-msg")
    const errorMsg = document.getElementById("error-msg")
    const statusFilter = document.getElementById("status-filter")

    let allItems = []
    let activeStatus = ""

    function showError(message) {
      errorMsg.textContent = message
      errorMsg.style.display = "flex"
    }

    function renderItems() {
      grid.innerHTML = ""
      errorMsg.style.display = "none"

      const filtered = activeStatus ? allItems.filter((i) => i.status === activeStatus) : allItems
      emptyMsg.style.display = filtered.length === 0 ? "block" : "none"

      for (const item of filtered) {
        const canEdit = item.status === "pending" || item.status === "assessed"
        const card = document.createElement("div")
        card.className = `item-card ${item.status}`

        const badgeClass = STATUS_BADGE_CLASS[item.status] || "badge-muted"
        const statusText = STATUS_LABEL[item.status] || item.status

        card.innerHTML = `
          <div class="item-card-head">
            <div>
              <div class="item-title">${FURNITURE_LABEL[item.furniture_type] || item.furniture_type}</div>
              <div style="font-size:11px; color:var(--muted);">รหัส #${item.id} · สภาพ: ${CONDITION_LABEL[item.condition] || item.condition}</div>
            </div>
            <span class="badge ${badgeClass}">${statusText}</span>
          </div>

          <div class="item-price">฿${item.estimated_price.toLocaleString()} บาท</div>
          <div style="font-size:12px; color:var(--ok); margin-bottom: 8px;">
            <i data-lucide="leaf" style="width:12px;height:12px;vertical-align:middle;"></i> ช่วยลด CO₂ ได้ ${item.co2_saved_kg.toFixed(1)} กก.
          </div>

          <div class="item-desc">${item.description || "ไม่มีรายละเอียดเพิ่มเติม"}</div>

          ${canEdit ? `
            <div class="item-actions">
              <button class="btn btn-outline edit-btn"><i data-lucide="edit-3"></i> แก้ไข</button>
              <button class="btn btn-danger delete-btn"><i data-lucide="trash-2"></i> ลบ</button>
              <a href="products.html?item_id=${item.id}" class="btn btn-primary"><i data-lucide="shopping-bag"></i> ใช้ส่วนลด</a>
            </div>
          ` : `
            <div class="item-actions">
              <span class="badge badge-muted" style="width:100%; justify-content:center; padding:8px;">รายการนี้เข้าสู่กระบวนการแล้ว</span>
            </div>
          `}

          <div class="edit-panel" style="display: none;"></div>
        `

        if (canEdit) {
          const editBtn = card.querySelector(".edit-btn")
          const deleteBtn = card.querySelector(".delete-btn")
          const editPanel = card.querySelector(".edit-panel")

          editBtn.addEventListener("click", () => {
            if (editPanel.style.display !== "none") {
              editPanel.style.display = "none"
              editPanel.innerHTML = ""
              return
            }

            editPanel.innerHTML = `
              <div class="field" style="margin-bottom:8px;">
                <label style="font-size:12px;">ประเภทเฟอร์นิเจอร์</label>
                <select class="edit-type" style="padding:6px 10px; font-size:13px;">
                  <option value="sofa" ${item.furniture_type === "sofa" ? "selected" : ""}>โซฟา</option>
                  <option value="table" ${item.furniture_type === "table" ? "selected" : ""}>โต๊ะ</option>
                  <option value="chair" ${item.furniture_type === "chair" ? "selected" : ""}>เก้าอี้</option>
                  <option value="bed" ${item.furniture_type === "bed" ? "selected" : ""}>เตียง</option>
                  <option value="wardrobe" ${item.furniture_type === "wardrobe" ? "selected" : ""}>ตู้เสื้อผ้า</option>
                  <option value="shelf" ${item.furniture_type === "shelf" ? "selected" : ""}>ชั้นวางของ</option>
                  <option value="other" ${item.furniture_type === "other" ? "selected" : ""}>อื่นๆ</option>
                </select>
              </div>
              <div class="field" style="margin-bottom:8px;">
                <label style="font-size:12px;">สภาพสินค้า</label>
                <div class="condition-mini">
                  <button type="button" class="edit-condition-btn ${item.condition === "good" ? "selected" : ""}" data-value="good">ดี</button>
                  <button type="button" class="edit-condition-btn ${item.condition === "fair" ? "selected" : ""}" data-value="fair">พอใช้</button>
                  <button type="button" class="edit-condition-btn ${item.condition === "poor" ? "selected" : ""}" data-value="poor">ทรุดโทรม</button>
                </div>
              </div>
              <div class="field" style="margin-bottom:8px;">
                <label style="font-size:12px;">รายละเอียด</label>
                <input type="text" class="edit-desc" value="${item.description || ""}" style="padding:6px 10px; font-size:13px;" />
              </div>
              <div class="msg msg-error edit-error" style="display:none; margin-bottom:8px;"></div>
              <div style="display:flex; gap:6px;">
                <button class="btn btn-outline cancel-edit-btn" style="flex:1; padding:6px;"><i data-lucide="x"></i> ยกเลิก</button>
                <button class="btn btn-primary save-edit-btn" style="flex:1; padding:6px;"><i data-lucide="check"></i> บันทึก</button>
              </div>
            `
            editPanel.style.display = "block"
            if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })

            let selectedCondition = item.condition
            editPanel.querySelectorAll(".edit-condition-btn").forEach((btn) => {
              btn.addEventListener("click", () => {
                editPanel.querySelectorAll(".edit-condition-btn").forEach((b) => b.classList.remove("selected"))
                btn.classList.add("selected")
                selectedCondition = btn.dataset.value
              })
            })

            editPanel.querySelector(".cancel-edit-btn").addEventListener("click", () => {
              editPanel.style.display = "none"
              editPanel.innerHTML = ""
            })

            editPanel.querySelector(".save-edit-btn").addEventListener("click", async () => {
              const saveBtn = editPanel.querySelector(".save-edit-btn")
              const editErrorEl = editPanel.querySelector(".edit-error")
              editErrorEl.style.display = "none"
              saveBtn.disabled = true
              saveBtn.textContent = "กำลังบันทึก..."
              try {
                await updateItem(item.id, {
                  furniture_type: editPanel.querySelector(".edit-type").value,
                  condition: selectedCondition,
                  description: editPanel.querySelector(".edit-desc").value.trim() || null,
                })
                toast("แก้ไขรายการสำเร็จ ราคาถูกคำนวณใหม่แล้ว", "success")
                await loadItems()
              } catch (err) {
                editErrorEl.textContent = `บันทึกไม่สำเร็จ: ${err.message}`
                editErrorEl.style.display = "block"
                saveBtn.disabled = false
                saveBtn.innerHTML = '<i data-lucide="check"></i> บันทึก'
              }
            })
          })

          deleteBtn.addEventListener("click", async () => {
            const ok = await confirmDialog(
              `ต้องการลบรายการ "${FURNITURE_LABEL[item.furniture_type] || item.furniture_type}" (#${item.id}) หรือไม่?`,
              { confirmLabel: "ลบ" }
            )
            if (!ok) return
            try {
              await deleteItem(item.id)
              toast("ลบรายการสำเร็จ", "success")
              await loadItems()
            } catch (err) {
              toast(`ลบไม่สำเร็จ: ${err.message}`, "error")
            }
          })
        }

        grid.appendChild(card)
      }

      if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
    }

    function renderStatusFilter() {
      statusFilter.innerHTML = ""
      STATUS_FILTERS.forEach(([value, label], idx) => {
        const btn = document.createElement("button")
        btn.textContent = label
        if (idx === 0) btn.classList.add("active")
        btn.addEventListener("click", () => {
          statusFilter.querySelectorAll("button").forEach((b) => b.classList.remove("active"))
          btn.classList.add("active")
          activeStatus = value
          renderItems()
        })
        statusFilter.appendChild(btn)
      })
    }

    async function loadItems() {
      try {
        allItems = await getItems()
        allItems.sort((a, b) => b.id - a.id)
        renderItems()
      } catch (err) {
        showError(`โหลดข้อมูลไม่สำเร็จ: ${err.message}`)
      }
    }

    renderStatusFilter()
    loadItems()
    initPage()
  </script>
</body>
</html>

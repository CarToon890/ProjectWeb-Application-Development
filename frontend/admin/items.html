<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ของเก่าทั้งระบบ — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .item-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .item-thumb-empty {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
    }
    .item-thumb-empty svg { width: 18px; height: 18px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <div class="page-header">
        <div class="page-header-main">
          <h1><i data-lucide="archive" style="vertical-align: middle; color: var(--accent); margin-right: 8px;"></i>รายการของเก่าทั้งระบบ</h1>
          <p class="subtitle" style="margin-bottom: 0;">ตรวจสอบรายการเฟอร์นิเจอร์เก่าที่ลูกค้าส่งประเมิน สภาพ และการส่งต่อ</p>
        </div>
        <div class="toolbar">
          <select id="status-select" class="inline-select" style="min-width: 150px; padding: 9px 12px;">
            <option value="">สถานะทั้งหมด</option>
            <option value="pending">รอตรวจสอบ</option>
            <option value="assessed">ประเมินแล้ว</option>
            <option value="scheduled">นัดหมายแล้ว</option>
            <option value="picked_up">รับของแล้ว</option>
            <option value="donated">ส่งต่อสำเร็จ</option>
          </select>
          <select id="type-select" class="inline-select" style="min-width: 150px; padding: 9px 12px;">
            <option value="">ประเภททั้งหมด</option>
            <option value="sofa">โซฟา</option>
            <option value="table">โต๊ะ</option>
            <option value="chair">เก้าอี้</option>
            <option value="bed">เตียง</option>
            <option value="wardrobe">ตู้เสื้อผ้า</option>
            <option value="shelf">ชั้นวางของ</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
      </div>

      <div id="loading-msg" class="empty-state">กำลังโหลดรายการของเก่า...</div>
      <div class="msg msg-error" id="error-msg"></div>

      <div class="table-wrap" id="table-wrap" style="display: none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>รูปถ่าย</th>
              <th>#</th>
              <th>ประเภท</th>
              <th>ระดับสภาพ</th>
              <th>ราคาประเมิน</th>
              <th>CO₂ ประหยัด</th>
              <th>สถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="items-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-msg" style="display: none;">
        <i data-lucide="package-search"></i>
        <div>ไม่พบรายการของเก่าตามเงื่อนไขที่เลือก</div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole("admin")
      renderNav({ root: "../", dir: "admin", active: "a-items" })
      renderFooter({ root: "../", dir: "admin" })
      await load()
      initPage()
    })()

    const FURNITURE_LABEL = {
      sofa: "โซฟา", table: "โต๊ะ", chair: "เก้าอี้", bed: "เตียง",
      wardrobe: "ตู้เสื้อผ้า", shelf: "ชั้นวางของ", other: "อื่นๆ",
    }
    const STATUS_LABEL = {
      pending: "รอตรวจสอบ", assessed: "ประเมินแล้ว", scheduled: "นัดหมายแล้ว",
      picked_up: "รับของแล้ว", donated: "ส่งต่อสำเร็จ",
    }
    const STATUS_BADGE_CLASS = {
      pending: "badge-muted", assessed: "badge-accent", scheduled: "badge-accent",
      picked_up: "badge-ok", donated: "badge-ok",
    }

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const emptyMsg = document.getElementById("empty-msg")
    const tableWrap = document.getElementById("table-wrap")
    const tbody = document.getElementById("items-body")
    const statusSelect = document.getElementById("status-select")
    const typeSelect = document.getElementById("type-select")

    let allItems = []

    function renderRows() {
      const status = statusSelect.value
      const type = typeSelect.value
      const rows = allItems.filter((i) => (!status || i.status === status) && (!type || i.furniture_type === type))

      tableWrap.style.display = rows.length > 0 ? "block" : "none"
      emptyMsg.style.display = rows.length === 0 ? "block" : "none"

      tbody.innerHTML = rows.map((item) => `
        <tr data-id="${item.id}">
          <td>
            ${item.photo_url
              ? `<img class="item-thumb" src="${item.photo_url}" alt="รูป" />`
              : `<span class="item-thumb-empty"><i data-lucide="image"></i></span>`
            }
          </td>
          <td><strong>#${item.id}</strong></td>
          <td>${FURNITURE_LABEL[item.furniture_type] || item.furniture_type}</td>
          <td>${item.condition}</td>
          <td><strong>฿${item.estimated_price.toLocaleString()} บาท</strong></td>
          <td><span class="text-ok"><i data-lucide="leaf" style="width:12px;height:12px;vertical-align:middle;"></i> ${item.co2_saved_kg.toFixed(1)} กก.</span></td>
          <td><span class="badge ${STATUS_BADGE_CLASS[item.status] || "badge-muted"}">${STATUS_LABEL[item.status] || item.status}</span></td>
          <td>
            <div style="display: flex; gap: 6px;">
              <select class="inline-select edit-type" style="padding: 4px 6px;">
                <option value="sofa" ${item.furniture_type === "sofa" ? "selected" : ""}>โซฟา</option>
                <option value="table" ${item.furniture_type === "table" ? "selected" : ""}>โต๊ะ</option>
                <option value="chair" ${item.furniture_type === "chair" ? "selected" : ""}>เก้าอี้</option>
                <option value="bed" ${item.furniture_type === "bed" ? "selected" : ""}>เตียง</option>
                <option value="wardrobe" ${item.furniture_type === "wardrobe" ? "selected" : ""}>ตู้เสื้อผ้า</option>
                <option value="shelf" ${item.furniture_type === "shelf" ? "selected" : ""}>ชั้นวาง</option>
                <option value="other" ${item.furniture_type === "other" ? "selected" : ""}>อื่นๆ</option>
              </select>
              <select class="inline-select edit-cond" style="padding: 4px 6px;">
                <option value="good" ${item.condition === "good" ? "selected" : ""}>ดี</option>
                <option value="fair" ${item.condition === "fair" ? "selected" : ""}>พอใช้</option>
                <option value="poor" ${item.condition === "poor" ? "selected" : ""}>ทรุดโทรม</option>
              </select>
              <button class="btn btn-outline btn-sm save-btn"><i data-lucide="check"></i> บันทึก</button>
            </div>
          </td>
        </tr>
      `).join("")

      tbody.querySelectorAll("tr").forEach((tr) => {
        const id = Number(tr.dataset.id)
        const saveBtn = tr.querySelector(".save-btn")
        if (!saveBtn) return

        saveBtn.addEventListener("click", async () => {
          const type = tr.querySelector(".edit-type").value
          const cond = tr.querySelector(".edit-cond").value
          saveBtn.disabled = true
          saveBtn.textContent = "..."
          try {
            const updated = await updateItem(id, { furniture_type: type, condition: cond })
            toast(`แก้ไขรายการ #${id} สำเร็จ ราคาใหม่: ฿${updated.estimated_price.toLocaleString()}`, "success")
            const target = allItems.find((i) => i.id === id)
            if (target) {
              target.furniture_type = updated.furniture_type
              target.condition = updated.condition
              target.estimated_price = updated.estimated_price
              target.co2_saved_kg = updated.co2_saved_kg
            }
            renderRows()
          } catch (err) {
            toast(`แก้ไขไม่สำเร็จ: ${err.message}`, "error")
            saveBtn.disabled = false
            saveBtn.innerHTML = '<i data-lucide="check"></i> บันทึก'
          }
        })
      })

      if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
    }

    statusSelect.addEventListener("change", renderRows)
    typeSelect.addEventListener("change", renderRows)

    async function load() {
      try {
        allItems = await getItems()
        allItems.sort((a, b) => b.id - a.id)
        loadingMsg.style.display = "none"
        renderRows()
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "flex"
      }
    }
  </script>
</body>
</html>

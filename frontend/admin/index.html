<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — The Disposal Guilt</title>
  <link rel="stylesheet" href="../css/main.css" />
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <div class="page-header">
        <div class="page-header-main">
          <h1><i data-lucide="layout-dashboard" style="vertical-align: middle; color: var(--accent); margin-right: 8px;"></i>Admin Dashboard</h1>
          <p class="subtitle" style="margin-bottom: 0;">ภาพรวมสถิติ คำสั่งจอง และรายการของเก่าในระบบแบบ Real-time</p>
        </div>
        <div class="toolbar">
          <a href="bookings.html" class="btn btn-primary btn-sm"><i data-lucide="calendar-check"></i> จัดการการจอง</a>
          <a href="items.html" class="btn btn-outline btn-sm"><i data-lucide="archive"></i> ของเก่าทั้งหมด</a>
          <a href="products.html" class="btn btn-outline btn-sm"><i data-lucide="package"></i> จัดการสินค้า</a>
        </div>
      </div>

      <div id="loading-msg" class="empty-state">กำลังดึงข้อมูลภาพรวมระบบ...</div>
      <div class="msg msg-error" id="error-msg"></div>

      <div id="content" style="display: none;">
        <!-- Metrics Row -->
        <div class="stat-row">
          <div class="stat-card">
            <div class="stat-card-icon"><i data-lucide="calendar"></i></div>
            <div class="stat-card-info">
              <div class="stat-value" id="stat-today">-</div>
              <div class="stat-label">นัดหมายวันนี้</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-icon" style="background: var(--warning-bg); color: var(--warning);"><i data-lucide="clock"></i></div>
            <div class="stat-card-info">
              <div class="stat-value" id="stat-pending" style="color: var(--warning);">-</div>
              <div class="stat-label">การจองรอยืนยัน</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-icon" style="background: var(--accent-bg); color: var(--accent);"><i data-lucide="archive"></i></div>
            <div class="stat-card-info">
              <div class="stat-value" id="stat-pending-items" style="color: var(--accent);">-</div>
              <div class="stat-label">ของรอตรวจสอบ</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-card-icon ok"><i data-lucide="leaf"></i></div>
            <div class="stat-card-info">
              <div class="stat-value ok" id="stat-co2">-</div>
              <div class="stat-label">กก. CO₂ รวมทั้งระบบ</div>
            </div>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin: var(--sp-8) 0 var(--sp-4);">
          <h2 style="font-size: 18px; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="clock"></i> การจองล่าสุดในระบบ
          </h2>
          <a href="bookings.html" class="btn btn-ghost btn-sm">ดูทั้งหมด <i data-lucide="arrow-right"></i></a>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>#</th>
                <th>ลูกค้า</th>
                <th>วันเวลานัดหมาย</th>
                <th>สถานะ</th>
                <th>ยอดรวมสุทธิ</th>
              </tr>
            </thead>
            <tbody id="recent-bookings-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole("admin")
      renderNav({ root: "../", dir: "admin", active: "dashboard" })
      renderFooter({ root: "../", dir: "admin" })

      const BOOKING_STATUS_LABEL = {
        pending: "รอยืนยัน", confirmed: "ยืนยันแล้ว", in_transit: "กำลังขนส่ง",
        completed: "เสร็จสิ้น", cancelled: "ยกเลิกแล้ว",
      }
      const BOOKING_BADGE_CLASS = {
        pending: "badge-warning", confirmed: "badge-accent", in_transit: "badge-accent",
        completed: "badge-ok", cancelled: "badge-danger",
      }

      try {
        const [bookings, items, eco] = await Promise.all([
          getBookings(),
          getItems(),
          getEcoStats(),
        ])

        const todayStr = new Date().toISOString().slice(0, 10)
        const countToday = bookings.filter(
          (b) => b.created_at && b.created_at.slice(0, 10) === todayStr
        ).length
        const countPending = bookings.filter((b) => b.status === "pending").length
        const countPendingItems = items.filter(
          (i) => i.status === "pending" || i.status === "assessed"
        ).length

        document.getElementById("stat-today").textContent = countToday
        document.getElementById("stat-pending").textContent = countPending
        document.getElementById("stat-pending-items").textContent = countPendingItems
        document.getElementById("stat-co2").textContent = (eco.total_co2_saved_kg || 0).toFixed(1)

        const recent = bookings.slice().sort((a, b) => b.id - a.id).slice(0, 8)
        const tbody = document.getElementById("recent-bookings-body")

        if (recent.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted); padding: 24px;">ยังไม่มีการจองในระบบ</td></tr>'
        } else {
          tbody.innerHTML = recent.map((b) => {
            const d = new Date(b.created_at)
            const dateStr = d.toLocaleDateString("th-TH", { day: "numeric", month: "short", year: "2-digit" })
            const timeStr = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })
            const badgeCls = BOOKING_BADGE_CLASS[b.status] || "badge-muted"
            const label = BOOKING_STATUS_LABEL[b.status] || b.status
            return `
              <tr>
                <td><strong>#${b.id}</strong></td>
                <td>ผู้ใช้ #${b.user_id}</td>
                <td>${dateStr} ${timeStr} น.</td>
                <td><span class="badge ${badgeCls}">${label}</span></td>
                <td><strong>฿${b.total_price.toLocaleString()} บาท</strong></td>
              </tr>
            `
          }).join("")
        }

        document.getElementById("loading-msg").style.display = "none"
        document.getElementById("content").style.display = "block"
        if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
      } catch (err) {
        document.getElementById("loading-msg").style.display = "none"
        const errEl = document.getElementById("error-msg")
        errEl.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errEl.style.display = "flex"
      }

      initPage()
    })()
  </script>
</body>
</html>

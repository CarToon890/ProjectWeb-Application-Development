<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการรอบเวลา — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .checkbox-row { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-top: 6px; }
    .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink); cursor: pointer; }
    .checkbox-row input { width: auto; accent-color: var(--accent); }
    .slot-tech-cell input { padding: 4px 8px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <div class="page-header">
        <div class="page-header-main">
          <h1><i data-lucide="clock" style="vertical-align: middle; color: var(--accent); margin-right: 8px;"></i>จัดการรอบเวลานัดหมาย & ทีมช่าง</h1>
          <p class="subtitle" style="margin-bottom: 0;">สร้างรอบเวลาเดี่ยว สร้างแบบหลายวันพร้อมกัน และจัดการสถานะความว่าง</p>
        </div>
      </div>

      <!-- Creation Grids (2 Columns) -->
      <div class="grid-cols-2" style="margin-bottom: var(--sp-8);">
        <!-- 1. Single Create -->
        <div class="card card-static" style="border-left-color: var(--accent);">
          <h2 style="font-size: 15px; margin-bottom: var(--sp-4);"><i data-lucide="plus-circle"></i> สร้างรอบเวลาเดี่ยว</h2>
          <form id="single-form">
            <div class="field">
              <label for="s-datetime">วันและเวลานัดหมาย</label>
              <input type="datetime-local" id="s-datetime" required />
            </div>
            <div class="field">
              <label for="s-technician">ชื่อทีมช่างผู้รับผิดชอบ</label>
              <input type="text" id="s-technician" placeholder="เช่น ทีมช่าง A" required />
            </div>
            <div class="msg msg-error" id="single-error"></div>
            <button type="submit" class="btn btn-primary" style="margin-top: var(--sp-3);">
              <i data-lucide="plus"></i> สร้างรอบเวลา
            </button>
          </form>
        </div>

        <!-- 2. Bulk Create -->
        <div class="card card-static" style="border-left-color: var(--ok);">
          <h2 style="font-size: 15px; margin-bottom: var(--sp-4);"><i data-lucide="calendar-plus"></i> สร้างหลายรอบพร้อมกัน (Bulk)</h2>
          <div class="grid-cols-2" style="gap: var(--sp-3);">
            <div class="field" style="margin-bottom: var(--sp-3);">
              <label for="b-start">วันที่เริ่มต้น</label>
              <input type="date" id="b-start" required />
            </div>
            <div class="field" style="margin-bottom: var(--sp-3);">
              <label for="b-end">วันที่สิ้นสุด</label>
              <input type="date" id="b-end" required />
            </div>
          </div>
          <div class="field" style="margin-bottom: var(--sp-3);">
            <label>เลือกรอบชั่วโมง</label>
            <div class="checkbox-row" id="bulk-hours">
              <label><input type="checkbox" value="9" checked /> 09:00</label>
              <label><input type="checkbox" value="13" checked /> 13:00</label>
              <label><input type="checkbox" value="15" checked /> 15:00</label>
            </div>
          </div>
          <div class="field" style="margin-bottom: var(--sp-3);">
            <label for="b-technicians">รายชื่อทีมช่าง (คั่นด้วยจุลภาค ,)</label>
            <input type="text" id="b-technicians" value="ทีมช่าง A, ทีมช่าง B, ทีมช่าง C" />
          </div>
          <div class="msg msg-error" id="bulk-error"></div>
          <button type="button" class="btn btn-ok" id="bulk-submit-btn">
            <i data-lucide="calendar-plus"></i> สร้างรอบเวลาพร้อมกัน
          </button>
        </div>
      </div>

      <!-- Timeslots List -->
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--sp-3);">
        <h2 style="font-size: 16px; display: flex; align-items: center; gap: 8px;">
          <i data-lucide="list"></i> รอบเวลานัดหมายทั้งหมดในระบบ
        </h2>
        <span class="badge badge-accent" id="slot-count-badge">- รายการ</span>
      </div>

      <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูลรอบเวลา...</div>
      <div class="msg msg-error" id="error-msg"></div>

      <div class="table-wrap" id="table-wrap" style="display: none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>วันและเวลานัด</th>
              <th>ทีมช่างผู้รับผิดชอบ</th>
              <th>สถานะความว่าง</th>
              <th>สลับสถานะ</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <tbody id="timeslots-body"></tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole("admin")
      renderNav({ root: "../", dir: "admin", active: "a-timeslots" })
      renderFooter({ root: "../", dir: "admin" })
      await loadSlots()
      initPage()
    })()

    const tbody = document.getElementById("timeslots-body")
    const tableWrap = document.getElementById("table-wrap")
    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const countBadge = document.getElementById("slot-count-badge")

    let allSlots = []

    function renderTable() {
      countBadge.textContent = `${allSlots.length} รายการ`
      if (allSlots.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--muted); padding:24px;">ยังไม่มีรอบเวลาในระบบ</td></tr>'
        return
      }

      tbody.innerHTML = allSlots.map((s) => {
        const d = new Date(s.datetime)
        const dateStr = d.toLocaleDateString("th-TH", { weekday: "short", day: "numeric", month: "short", year: "2-digit" })
        const timeStr = d.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น."

        return `
          <tr data-id="${s.id}">
            <td><strong>#${s.id}</strong></td>
            <td><strong>${dateStr}</strong> เวลา ${timeStr}</td>
            <td class="slot-tech-cell">
              <input type="text" class="tech-input" value="${s.technician_name}" style="padding: 4px 8px; width: 140px;" />
              <button class="btn btn-outline btn-sm save-tech-btn" style="padding: 3px 8px; margin-left: 4px;"><i data-lucide="check"></i></button>
            </td>
            <td>
              <span class="badge ${s.is_available ? "badge-ok" : "badge-muted"}">
                ${s.is_available ? "ว่าง (จองได้)" : "ถูกจอง / ปิดรับ"}
              </span>
            </td>
            <td>
              <button class="btn btn-outline btn-sm toggle-btn">
                ${s.is_available ? "เปลี่ยนเป็นไม่ว่าง" : "เปลี่ยนเป็นว่าง"}
              </button>
            </td>
            <td>
              <button class="btn btn-danger btn-sm delete-btn"><i data-lucide="trash-2"></i> ลบ</button>
            </td>
          </tr>
        `
      }).join("")

      tbody.querySelectorAll("tr").forEach((tr) => {
        const id = Number(tr.dataset.id)
        const s = allSlots.find((item) => item.id === id)

        tr.querySelector(".save-tech-btn").addEventListener("click", async () => {
          const tech = tr.querySelector(".tech-input").value.trim()
          if (!tech) return toast("กรุณาระบุชื่อทีมช่าง", "error")
          try {
            await updateTimeslot(id, { technician_name: tech })
            toast(`อัปเดตทีมช่างของรอบ #${id} สำเร็จ`, "success")
            s.technician_name = tech
            renderTable()
          } catch (err) {
            toast(`อัปเดตไม่สำเร็จ: ${err.message}`, "error")
          }
        })

        tr.querySelector(".toggle-btn").addEventListener("click", async () => {
          const newAvail = !s.is_available
          try {
            await updateTimeslot(id, { is_available: newAvail })
            toast(`เปลี่ยนสถานะรอบ #${id} เรียบร้อย`, "success")
            s.is_available = newAvail
            renderTable()
          } catch (err) {
            toast(`เปลี่ยนสถานะไม่สำเร็จ: ${err.message}`, "error")
          }
        })

        tr.querySelector(".delete-btn").addEventListener("click", async () => {
          const ok = await confirmDialog(`ต้องการลบรอบเวลา #${id} หรือไม่?`, { confirmLabel: "ลบ" })
          if (!ok) return
          try {
            await deleteTimeslot(id)
            toast("ลบรอบเวลาสำเร็จ", "success")
            allSlots = allSlots.filter((item) => item.id !== id)
            renderTable()
          } catch (err) {
            toast(`ลบไม่สำเร็จ: ${err.message}`, "error")
          }
        })
      })

      if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
    }

    document.getElementById("single-form").addEventListener("submit", async (e) => {
      e.preventDefault()
      const errorEl = document.getElementById("single-error")
      errorEl.style.display = "none"

      const dt = document.getElementById("s-datetime").value
      const tech = document.getElementById("s-technician").value.trim()
      if (!dt || !tech) return

      try {
        const created = await createTimeslot({
          datetime: new Date(dt).toISOString(),
          technician_name: tech,
        })
        toast("สร้างรอบเวลาสำเร็จ", "success")
        allSlots.unshift(created)
        allSlots.sort((a, b) => new Date(a.datetime) - new Date(b.datetime))
        renderTable()
        e.target.reset()
      } catch (err) {
        errorEl.textContent = err.message
        errorEl.style.display = "flex"
      }
    })

    document.getElementById("bulk-submit-btn").addEventListener("click", async () => {
      const errorEl = document.getElementById("bulk-error")
      errorEl.style.display = "none"

      const startStr = document.getElementById("b-start").value
      const endStr = document.getElementById("b-end").value
      const techInput = document.getElementById("b-technicians").value.trim()

      if (!startStr || !endStr) {
        errorEl.textContent = "กรุณาระบุวันที่เริ่มต้นและสิ้นสุด"
        errorEl.style.display = "flex"
        return
      }

      const hours = Array.from(document.querySelectorAll("#bulk-hours input:checked")).map((i) => Number(i.value))
      if (hours.length === 0) {
        errorEl.textContent = "กรุณาเลือกช่วงเวลาอย่างน้อย 1 ช่วง"
        errorEl.style.display = "flex"
        return
      }

      const technicians = techInput ? techInput.split(",").map((s) => s.trim()).filter(Boolean) : ["ทีมช่าง"]
      const btn = document.getElementById("bulk-submit-btn")
      btn.disabled = true
      btn.textContent = "กำลังสร้าง..."

      const start = new Date(startStr)
      const end = new Date(endStr)
      let count = 0
      let techIdx = 0

      try {
        const cur = new Date(start)
        while (cur <= end) {
          for (const h of hours) {
            const dt = new Date(cur)
            dt.setHours(h, 0, 0, 0)
            const tech = technicians[techIdx % technicians.length]
            techIdx++

            const created = await createTimeslot({
              datetime: dt.toISOString(),
              technician_name: tech,
            })
            allSlots.push(created)
            count++
          }
          cur.setDate(cur.getDate() + 1)
        }

        toast(`สร้างรอบเวลาสำเร็จทั้งหมด ${count} รอบ`, "success")
        allSlots.sort((a, b) => new Date(a.datetime) - new Date(b.datetime))
        renderTable()
      } catch (err) {
        errorEl.textContent = `สร้างไม่สำเร็จทั้งหมด (สร้างไปแล้ว ${count} รอบ): ${err.message}`
        errorEl.style.display = "flex"
        renderTable()
      } finally {
        btn.disabled = false
        btn.innerHTML = '<i data-lucide="calendar-plus"></i> สร้างรอบเวลาพร้อมกัน'
        if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
      }
    })

    async function loadSlots() {
      try {
        allSlots = await getAllTimeslots()
        allSlots.sort((a, b) => new Date(a.datetime) - new Date(b.datetime))
        loadingMsg.style.display = "none"
        tableWrap.style.display = "block"
        renderTable()
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดรอบเวลาไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "flex"
      }
    }
  </script>
</body>
</html>

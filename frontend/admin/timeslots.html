<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการรอบเวลา — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
    .form-grid .field { margin-bottom: 0; }

    .checkbox-row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; }
    .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; color: var(--ink); }
    .checkbox-row input { width: auto; accent-color: var(--accent); }

    .day-badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--bg); color: var(--muted); margin-left: 6px; }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="container container-lg">
    <h1>จัดการรอบเวลา</h1>
    <p class="subtitle">สร้างรอบนัดหมายให้ช่างและจัดการรอบที่มีอยู่</p>

    <div class="card">
      <h2>สร้างรอบเวลาเดี่ยว</h2>
      <form id="single-form">
        <div class="form-grid">
          <div class="field">
            <label for="s-datetime">วันที่-เวลา</label>
            <input type="datetime-local" id="s-datetime" required />
          </div>
          <div class="field">
            <label for="s-technician">ชื่อช่าง</label>
            <input type="text" id="s-technician" placeholder="เช่น ทีมช่าง A" required />
          </div>
        </div>
        <div class="msg msg-error" id="single-error"></div>
        <button type="submit" class="btn btn-primary" style="margin-top:16px;">สร้างรอบเวลา</button>
      </form>
    </div>

    <div class="card">
      <h2>สร้างหลายรอบพร้อมกัน</h2>
      <div class="form-grid">
        <div class="field">
          <label for="b-start">วันที่เริ่ม</label>
          <input type="date" id="b-start" required />
        </div>
        <div class="field">
          <label for="b-end">วันที่สิ้นสุด</label>
          <input type="date" id="b-end" required />
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>ช่วงเวลา</label>
        <div class="checkbox-row" id="bulk-hours">
          <label><input type="checkbox" value="9" checked /> 09:00</label>
          <label><input type="checkbox" value="13" checked /> 13:00</label>
          <label><input type="checkbox" value="15" checked /> 15:00</label>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="b-technicians">รายชื่อช่าง (คั่นด้วยจุลภาค — สลับกันตามรอบ)</label>
        <input type="text" id="b-technicians" value="ทีมช่าง A, ทีมช่าง B, ทีมช่าง C" />
      </div>

      <div class="msg msg-error" id="bulk-error"></div>
      <div class="msg msg-success" id="bulk-success"></div>
      <button type="button" class="btn btn-primary" id="bulk-submit-btn" style="margin-top:16px;">สร้างรอบเวลาหลายวัน</button>
    </div>

    <div id="loading-msg" class="empty-state">กำลังโหลดข้อมูล...</div>
    <div class="msg msg-error" id="error-msg"></div>

    <div class="table-wrap" id="table-wrap" style="display: none;">
      <table class="data-table">
        <thead>
          <tr><th>#</th><th>วันเวลา</th><th>ช่าง</th><th>สถานะ</th><th>จัดการ</th></tr>
        </thead>
        <tbody id="timeslots-body"></tbody>
      </table>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole("admin")
      renderNav({ root: "../", dir: "admin", active: "a-timeslots" })
      load()
    })()

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const tableWrap = document.getElementById("table-wrap")
    const tbody = document.getElementById("timeslots-body")

    function formatDateTime(dt) {
      return new Date(dt).toLocaleString("th-TH", { weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
    }

    // ---------- สร้างรอบเดี่ยว ----------
    const singleForm = document.getElementById("single-form")
    const singleError = document.getElementById("single-error")

    singleForm.addEventListener("submit", async (e) => {
      e.preventDefault()
      singleError.style.display = "none"
      const datetimeValue = document.getElementById("s-datetime").value
      const technician = document.getElementById("s-technician").value.trim()
      try {
        await createTimeslot({ datetime: new Date(datetimeValue).toISOString(), technician_name: technician })
        toast("สร้างรอบเวลาสำเร็จ", "success")
        singleForm.reset()
        await load()
      } catch (err) {
        singleError.textContent = `สร้างไม่สำเร็จ: ${err.message}`
        singleError.style.display = "block"
      }
    })

    // ---------- สร้างหลายรอบพร้อมกัน ----------
    const bulkError = document.getElementById("bulk-error")
    const bulkSuccess = document.getElementById("bulk-success")
    const bulkSubmitBtn = document.getElementById("bulk-submit-btn")

    bulkSubmitBtn.addEventListener("click", async () => {
      bulkError.style.display = "none"
      bulkSuccess.style.display = "none"

      const startStr = document.getElementById("b-start").value
      const endStr = document.getElementById("b-end").value
      const hours = Array.from(document.querySelectorAll("#bulk-hours input:checked")).map((el) => Number(el.value))
      const technicians = document.getElementById("b-technicians").value.split(",").map((t) => t.trim()).filter(Boolean)

      if (!startStr || !endStr) {
        bulkError.textContent = "กรุณาระบุวันที่เริ่มและสิ้นสุด"
        bulkError.style.display = "block"
        return
      }
      if (hours.length === 0) {
        bulkError.textContent = "กรุณาเลือกช่วงเวลาอย่างน้อย 1 ช่วง"
        bulkError.style.display = "block"
        return
      }
      if (technicians.length === 0) {
        bulkError.textContent = "กรุณาระบุชื่อช่างอย่างน้อย 1 คน"
        bulkError.style.display = "block"
        return
      }

      const start = new Date(startStr + "T00:00:00")
      const end = new Date(endStr + "T00:00:00")
      if (end < start) {
        bulkError.textContent = "วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม"
        bulkError.style.display = "block"
        return
      }

      const slotsToCreate = []
      let technicianIdx = 0
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        for (const hour of hours.sort((a, b) => a - b)) {
          const dt = new Date(d)
          dt.setHours(hour, 0, 0, 0)
          slotsToCreate.push({
            datetime: dt.toISOString(),
            technician_name: technicians[technicianIdx % technicians.length],
          })
          technicianIdx++
        }
      }

      bulkSubmitBtn.disabled = true
      bulkSubmitBtn.textContent = `กำลังสร้าง ${slotsToCreate.length} รอบ...`
      try {
        await Promise.all(slotsToCreate.map((s) => createTimeslot(s)))
        bulkSuccess.textContent = `สร้างรอบเวลาสำเร็จ ${slotsToCreate.length} รอบ`
        bulkSuccess.style.display = "block"
        toast(`สร้างรอบเวลาสำเร็จ ${slotsToCreate.length} รอบ`, "success")
        await load()
      } catch (err) {
        bulkError.textContent = `สร้างบางรอบไม่สำเร็จ: ${err.message}`
        bulkError.style.display = "block"
        await load()
      } finally {
        bulkSubmitBtn.disabled = false
        bulkSubmitBtn.textContent = "สร้างรอบเวลาหลายวัน"
      }
    })

    // ---------- ตารางรอบเวลาทั้งหมด ----------
    async function load() {
      try {
        const slots = await getAllTimeslots()
        slots.sort((a, b) => new Date(a.datetime) - new Date(b.datetime))
        loadingMsg.style.display = "none"
        tableWrap.style.display = "block"

        const now = new Date()
        tbody.innerHTML = slots.map((s) => {
          const isPast = new Date(s.datetime) < now
          const statusBadge = !s.is_available
            ? `<span class="badge badge-accent">จองแล้ว</span>`
            : isPast
              ? `<span class="badge badge-muted">หมดเวลา</span>`
              : `<span class="badge badge-ok">ว่าง</span>`
          return `
            <tr>
              <td>#${s.id}</td>
              <td>${formatDateTime(s.datetime)}${isPast ? '<span class="day-badge">ผ่านมาแล้ว</span>' : ""}</td>
              <td>${s.technician_name}</td>
              <td>${statusBadge}</td>
              <td><button class="btn btn-danger delete-slot-btn" data-id="${s.id}" style="padding:6px 12px; font-size:12px;">ลบ</button></td>
            </tr>
          `
        }).join("") || `<tr><td colspan="5" style="text-align:center; color:var(--muted-2);">ยังไม่มีรอบเวลา</td></tr>`

        tbody.querySelectorAll(".delete-slot-btn").forEach((btn) => {
          btn.addEventListener("click", async () => {
            const id = Number(btn.dataset.id)
            const ok = await confirmDialog("ต้องการลบรอบเวลานี้ใช่หรือไม่?", { confirmLabel: "ลบ" })
            if (!ok) return
            try {
              await deleteTimeslot(id)
              toast("ลบรอบเวลาสำเร็จ", "success")
              await load()
            } catch (err) {
              toast(`ลบไม่สำเร็จ: ${err.message}`, "error")
            }
          })
        })
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดข้อมูลไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "block"
      }
    }
  </script>
</body>
</html>

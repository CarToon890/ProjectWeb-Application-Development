<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>จัดการผู้ใช้ — Admin</title>
  <link rel="stylesheet" href="../css/main.css" />
  <style>
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-3);
      margin-top: var(--sp-6);
    }
    .page-label { font-size: 13px; font-weight: 600; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <main class="main-content">
    <div class="container-xl">
      <div class="page-header">
        <div class="page-header-main">
          <h1><i data-lucide="users" style="vertical-align: middle; color: var(--accent); margin-right: 8px;"></i>จัดการผู้ใช้งานและสิทธิ์ระบบ</h1>
          <p class="subtitle" style="margin-bottom: 0;">ตรวจสอบรายชื่อผู้ใช้งาน ลูกค้า ทีมช่าง และผู้ดูแลระบบ</p>
        </div>
      </div>

      <div id="loading-msg" class="empty-state">กำลังโหลดรายชื่อผู้ใช้...</div>
      <div class="msg msg-error" id="error-msg"></div>

      <div class="table-wrap" id="table-wrap" style="display: none;">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Username</th>
              <th>ชื่อ-นามสกุล</th>
              <th>อีเมล</th>
              <th>เบอร์โทรศัพท์</th>
              <th>สิทธิ์ปัจจุบัน</th>
              <th>เปลี่ยนสิทธิ์ (Role)</th>
            </tr>
          </thead>
          <tbody id="users-body"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination-wrap" style="display: none;">
        <button class="btn btn-outline btn-sm" id="prev-btn"><i data-lucide="chevron-left"></i> ก่อนหน้า</button>
        <span class="page-label" id="page-label">หน้า 1</span>
        <button class="btn btn-outline btn-sm" id="next-btn">ถัดไป <i data-lucide="chevron-right"></i></button>
      </div>
    </div>
  </main>

  <div id="app-footer"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/components.js"></script>
  <script>
    ;(async () => {
      await requireRole("admin")
      renderNav({ root: "../", dir: "admin", active: "a-users" })
      renderFooter({ root: "../", dir: "admin" })
      await load()
      initPage()
    })()

    const ROLES = ["user", "staff", "admin"]
    const ROLE_LABEL = { user: "ลูกค้า (Customer)", staff: "ทีมช่าง (Staff)", admin: "ผู้ดูแลระบบ (Admin)" }
    const ROLE_BADGE = { user: "badge-muted", staff: "badge-accent", admin: "badge-ok" }
    const LIMIT = 10

    const loadingMsg = document.getElementById("loading-msg")
    const errorMsg = document.getElementById("error-msg")
    const tableWrap = document.getElementById("table-wrap")
    const tbody = document.getElementById("users-body")
    const prevBtn = document.getElementById("prev-btn")
    const nextBtn = document.getElementById("next-btn")
    const pageLabel = document.getElementById("page-label")
    const paginationWrap = document.getElementById("pagination-wrap")

    let currentPage = 1
    let totalUsers = 0

    function renderRows(users) {
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:var(--muted); padding:24px;">ไม่พบรายชื่อผู้ใช้</td></tr>'
        return
      }

      tbody.innerHTML = users.map((u) => {
        const options = ROLES.map((r) =>
          `<option value="${r}" ${r === u.role ? "selected" : ""}>${ROLE_LABEL[r]}</option>`
        ).join("")

        return `
          <tr data-id="${u.id}">
            <td><strong>#${u.id}</strong></td>
            <td><strong>@${u.username}</strong></td>
            <td>${u.full_name}</td>
            <td>${u.email}</td>
            <td>${u.phone || '<span style="color:var(--muted);">-</span>'}</td>
            <td><span class="badge ${ROLE_BADGE[u.role] || "badge-muted"}">${ROLE_LABEL[u.role] || u.role}</span></td>
            <td>
              <select class="inline-select role-select" data-id="${u.id}">
                ${options}
              </select>
            </td>
          </tr>
        `
      }).join("")

      tbody.querySelectorAll(".role-select").forEach((sel) => {
        sel.addEventListener("change", async (e) => {
          const userId = Number(e.target.dataset.id)
          const newRole = e.target.value
          const ok = await confirmDialog(`ต้องการเปลี่ยนสิทธิ์ของผู้ใช้ #${userId} เป็น "${ROLE_LABEL[newRole]}" ใช่หรือไม่?`)
          if (!ok) {
            load()
            return
          }
          try {
            await updateUserRole(userId, newRole)
            toast(`อัปเดตสิทธิ์ของผู้ใช้ #${userId} สำเร็จ`, "success")
            load()
          } catch (err) {
            toast(`เปลี่ยนสิทธิ์ไม่สำเร็จ: ${err.message}`, "error")
            load()
          }
        })
      })

      if (typeof lucide !== "undefined") lucide.createIcons({ nameAttr: "data-lucide" })
    }

    async function load() {
      loadingMsg.style.display = "block"
      tableWrap.style.display = "none"
      paginationWrap.style.display = "none"
      try {
        const data = await getUsers(currentPage, LIMIT)
        const users = Array.isArray(data) ? data : data.items || []
        totalUsers = data.total !== undefined ? data.total : users.length

        loadingMsg.style.display = "none"
        tableWrap.style.display = "block"
        paginationWrap.style.display = "flex"

        renderRows(users)

        const totalPages = Math.ceil(totalUsers / LIMIT) || 1
        pageLabel.textContent = `หน้า ${currentPage} จาก ${totalPages}`
        prevBtn.disabled = currentPage <= 1
        nextBtn.disabled = currentPage >= totalPages
      } catch (err) {
        loadingMsg.style.display = "none"
        errorMsg.textContent = `โหลดรายชื่อผู้ใช้ไม่สำเร็จ: ${err.message}`
        errorMsg.style.display = "flex"
      }
    }

    prevBtn.addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage--
        load()
      }
    })

    nextBtn.addEventListener("click", () => {
      currentPage++
      load()
    })
  </script>
</body>
</html>
